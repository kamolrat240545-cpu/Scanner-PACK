    body {

      font-family:

    label {

      border-radius: 12px;

    input[readonly] {

    }

      height: 60px;

      margin-top: 15px;

      position: relative;

    #video {

      height: auto;

      min-height: 250px;

      background: #000;

      object-fit: cover;
    }


    /* ======================================
       แจ้งเตือน
       ====================================== */

    #message {
      display: none;

      margin-top: 18px;

      padding: 16px;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      line-height: 1.5;

      word-break: break-word;
    }


    #message.success {
      display: block;

      background: #dcfce7;

      color: #166534;
    }


    #message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }


    #message.warning {
      display: block;

      background: #fff3cd;

      color: #856404;
    }


    /* ======================================
       ประวัติ
       ====================================== */

    .history-title {

      margin-bottom: 12px;

      font-size: 25px;
    }


    .history-item {

      border-radius: 10px;

      background: #fafafa;
    }

      word-break: break-all;
    }

    @media (max-width: 600px) {

      }

        border-radius: 12px;

      }

        font-size: 18px;
      }

<script>

// =====================================================

// =====================================================

let codeReader = null;

let cameraControls = null;

let cameraStarting = false;

let scanHandled = false;


// =====================================================
// Element
// =====================================================

const employeeSelect =

    "employee"
  );


const fullNameInput =

  );

  );

  );


// =====================================================

      fullNameInput.value =
        "";

      nicknameInput.value =

    const person =
      employees[index];


    fullNameInput.value =
      person[0];


    nicknameInput.value =
      person[1];

  }
);


// =====================================================
// JSONP
// GitHub → Apps Script
// =====================================================

function callAppsScript(
  params
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      let timeoutId =
        null;


      function cleanup() {

        if (timeoutId) {

          clearTimeout(
            timeoutId
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          resolve(data);

        };


      params.callback =
        callbackName;


      const query =
        new URLSearchParams();


      Object.keys(params)
        .forEach(
          function(key) {

            query.append(
              key,
              params[key]
            );

          }
        );


      script.src =
        WEB_APP_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              "Load failed"
            )
          );

        };


      document.body.appendChild(
        script
      );


      timeoutId =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "เชื่อมต่อ Apps Script ไม่สำเร็จ"
              )
            );

          },
          15000
        );

    }
  );

}


// =====================================================
// เช็ก Barcode ซ้ำทันที
// =====================================================

async function checkBarcodeImmediately(
  barcode
) {

  barcode =
    String(
      barcode || ""
    ).trim();


  if (!barcode) {

    return false;

  }


  try {

    const result =
      await callAppsScript({

        action:
          "check",

        barcode:
          barcode

      });


    if (
      result &&
      result.success &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      return true;

    }


    return false;


  } catch (error) {

    console.error(
      "Check barcode error:",
      error
    );


    showMessage(
      "เช็ก Barcode ไม่สำเร็จ: " +
      error.message,
      false
    );


    return false;

  }

}


// =====================================================
// เปิดกล้อง
// =====================================================

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  // ป้องกันกดเปิดกล้องซ้ำหลายครั้ง
  if (cameraStarting) {

    return;

  }


  cameraStarting =
    true;


  // ===================================================
  // เปิดกล้องใหม่ = ล้างข้อความแจ้งเตือนเก่า
  // ===================================================

  clearMessage();


  // ===================================================
  // ปิดกล้องเก่าให้หมดก่อน
  // ===================================================

  stopCamera();


  // รอให้กล้องเก่าปิดสมบูรณ์
  await wait(500);


  scanHandled =
    false;


  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "โหลดระบบสแกน Barcode ไม่สำเร็จ"
      );

    }


    // =================================================
    // สร้าง Reader ใหม่ทุกครั้ง
    // =================================================

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    // =================================================
    // ขอรายการกล้อง
    // =================================================

    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้อง"
      );

    }


    // =================================================
    // เลือกกล้องหลัง
    // =================================================

    let deviceId =
      devices[
        devices.length - 1
      ].deviceId;


    // ถ้ามีหลายกล้อง พยายามเลือกกล้องหลัง
    for (
      let i = 0;
      i < devices.length;
      i++
    ) {

      const label =
        (
          devices[i].label ||
          ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        deviceId =
          devices[i].deviceId;

        break;

      }

    }


    // =================================================
    // เปิดพื้นที่กล้อง
    // =================================================

    cameraBox.style.display =
      "block";


    // =================================================
    // เริ่มกล้อง
    // =================================================

    cameraControls =
      await codeReader
        .decodeFromVideoDevice(

          deviceId,

          video,

          async function(
            result
          ) {

            // ไม่มีผลลัพธ์
            if (!result) {

              return;

            }


            // ป้องกันสแกนซ้ำจากเฟรมเดียวกัน
            if (scanHandled) {

              return;

            }


            scanHandled =
              true;


            // =================================================
            // อ่าน Barcode
            // =================================================

            const code =
              String(
                result.getText() || ""
              ).trim();


            if (!code) {

              scanHandled =
                false;

              return;

            }


            // =================================================
            // ใส่ Barcode ลงช่อง
            // =================================================

            barcodeInput.value =
              code;


            // =================================================
            // หยุดกล้องทันที
            // =================================================

            stopCamera();


            // =================================================
            // เช็ก Barcode ซ้ำทันที
            // =================================================

            const duplicate =
              await checkBarcodeImmediately(
                code
              );


            // =================================================
            // ถ้าไม่ซ้ำ
            // =================================================

            if (!duplicate) {

              showMessage(
                "✅ สแกนสำเร็จ: " +
                code,
                true
              );

            }

          }

        );


    // =================================================
    // รอให้ video พร้อม
    // =================================================

    try {

      if (
        video.readyState <
        2
      ) {

        await wait(
          500
        );

      }

    } catch (e) {

      console.error(e);

    }


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    stopCamera();


    showMessage(
      "เปิดกล้องไม่ได้: " +
      (
        error.message ||
        error
      ),
      false
    );


  } finally {

    cameraStarting =
      false;

  }

}


// =====================================================
// ฟังก์ชันรอ
// =====================================================

function wait(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


// =====================================================
// ปิดกล้อง
// สำคัญ: ล้าง Reader + Video + Stream
// เพื่อให้เปิดรอบใหม่ได้จริง
// =====================================================

function stopCamera() {

  scanHandled =
    true;


  // ===================================================
  // หยุด ZXing controls
  // ===================================================

  try {

    if (cameraControls) {

      cameraControls.stop();

      cameraControls =
        null;

    }

  } catch (error) {

    console.error(
      "cameraControls stop error:",
      error
    );

  }


  // ===================================================
  // Reset Reader
  // ===================================================

  try {

    if (codeReader) {

      codeReader.reset();

    }

  } catch (error) {

    console.error(
      "codeReader reset error:",
      error
    );

  }


  codeReader =
    null;


  // ===================================================
  // หยุดทุก Video Track
  // ===================================================

  try {

    if (
      video.srcObject
    ) {

      const tracks =
        video.srcObject
          .getTracks();


      tracks.forEach(
        function(track) {

          try {

            track.stop();

          } catch (e) {

            console.error(e);

          }

        }
      );


      video.srcObject =
        null;

    }

  } catch (error) {

    console.error(
      "video stream stop error:",
      error
    );

  }


  // ===================================================
  // Reset video element
  // ===================================================

  try {

    video.pause();

    video.removeAttribute(
      "src"
    );

    video.load();

  } catch (error) {

    console.error(
      "video reset error:",
      error
    );

  }


  // ===================================================
  // ซ่อนกล้อง
  // ===================================================

  cameraBox.style.display =
    "none";

}


// =====================================================
// ปุ่มปิดกล้อง
// =====================================================

stopCameraButton.addEventListener(
  "click",
  function() {

    stopCamera();

  }
);


// =====================================================
// บันทึกข้อมูล
// =====================================================

  "click",
  saveData
);


async function saveData() {

  const fullName =
    fullNameInput.value.trim();


  const nickname =
    nicknameInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  // ===================================================
  // ตรวจพนักงาน
  // ===================================================

  if (!fullName) {

    showMessage(
      "กรุณาเลือกพนักงานก่อน",
      false
    );

    return;

  }


  // ===================================================
  // ตรวจ Barcode
  // ===================================================

  if (!barcode) {

    showMessage(
      "กรุณาสแกนหรือกรอกเลขพัสดุ",
      false
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  try {

    // =================================================
    // เช็กซ้ำอีกครั้งก่อนบันทึก
    // =================================================

    const duplicate =
      await checkBarcodeImmediately(
        barcode
      );


    if (duplicate) {

      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // =================================================
    // ส่งข้อมูลไป Apps Script
    // =================================================

    const result =
      await callAppsScript({

        action:
          "save",

        fullName:
          fullName,

        nickname:
          nickname,

        barcode:
          barcode

      });


    // =================================================
    // Backend พบ Barcode ซ้ำ
    // =================================================

    if (
      result &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // =================================================
    // บันทึกสำเร็จ
    // =================================================

    if (
      result &&
      result.success
    ) {

      showMessage(
        "✅ บันทึกสำเร็จ: " +
        barcode,
        true
      );


      // ล้าง Barcode
      barcodeInput.value =
        "";


      // โหลดประวัติใหม่
      loadHistory();


    } else {

      showMessage(
        result &&
        result.message
          ? result.message
          : "บันทึกข้อมูลไม่สำเร็จ",
        false
      );

    }


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    showMessage(
      "เชื่อมต่อระบบไม่ได้: " +
      error.message,
      false
    );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "💾 บันทึกข้อมูล";

}


// =====================================================
// โหลดประวัติ
// =====================================================

async function loadHistory() {

  historyList.innerHTML =
    '<div class="empty">' +
    'กำลังโหลดข้อมูล...' +
    '</div>';


  try {

    const result =
      await callAppsScript({

        action:
          "history",

        limit:
          "20"

      });


    // =================================================
    // ไม่มีข้อมูล
    // =================================================

    if (
      !result ||
      !result.success ||
      !result.items ||
      result.items.length === 0
    ) {

      historyList.innerHTML =
        '<div class="empty">' +
        'ยังไม่มีข้อมูลการสแกน' +
        '</div>';

      return;

    }


    historyList.innerHTML =
      "";


    // =================================================
    // แสดงประวัติ
    // =================================================

    result.items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        const barcode =
          document.createElement(
            "div"
          );


        barcode.className =
          "history-barcode";


        barcode.textContent =
          item.barcode ||
          "";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "history-name";


        name.textContent =
          (
            item.fullName ||
            ""
          ) +
          (
            item.nickname
              ? " (" +
                item.nickname +
                ")"
              : ""
          );


        const time =
          document.createElement(
            "div"
          );


        time.className =
          "history-time";


        time.textContent =
          (
            item.date ||
            ""
          ) +
          " " +
          (
            item.time ||
            ""
          );


        div.appendChild(
          barcode
        );


        div.appendChild(
          name
        );


        div.appendChild(
          time
        );


        historyList.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(
      "History error:",
      error
    );


    historyList.innerHTML =
      '<div class="empty">' +
      'โหลดประวัติไม่สำเร็จ: ' +
      error.message +
      '</div>';

  }

}


// =====================================================
// แจ้งเตือนทั่วไป
// =====================================================

function showMessage(
  text,
  success
) {

  messageBox.textContent =
    text;


  messageBox.className =
    success
      ? "success"
      : "error";


  messageBox.style.display =
    "block";

}


// =====================================================
// แจ้งเตือน Barcode ซ้ำ
// ค้างไว้จนกว่าจะเปิดกล้องใหม่
// =====================================================

function showPermanentWarning(
  text,
  barcode
) {

  messageBox.textContent =
    text +
    " " +
    barcode;


  messageBox.className =
    "warning";


  messageBox.style.display =
    "block";

}


// =====================================================
// ล้างข้อความ
// เปิดกล้องใหม่แล้วค่อยล้าง
// =====================================================

function clearMessage() {

  messageBox.textContent =
    "";


  messageBox.className =
    "";


  messageBox.style.display =
    "none";

}


// =====================================================
// เริ่มระบบ
// =====================================================

loadHistory();


</script>


</body>

</html>
