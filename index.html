    nicknameInput.value =
      person[1];

);


// =====================================================
// JSONP
// =====================================================

function callAppsScript(
  params
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      let timeoutId =
        null;


      function cleanup() {

        if (timeoutId) {

          clearTimeout(
            timeoutId
          );

          timeoutId =
            null;

        }


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          resolve(
            data
          );

        };


      params.callback =
        callbackName;


      const query =
        new URLSearchParams();


      Object.keys(params)
        .forEach(
          function(key) {

            query.append(
              key,
              params[key]
            );

          }
        );


      script.src =
        WEB_APP_URL +
        "?" +
        query.toString();


      script.async =
        true;


      script.onerror =
        function() {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "Load failed"
            )
          );

        };


      document.body.appendChild(
        script
      );


      timeoutId =
        setTimeout(
          function() {

            if (finished) {

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "เชื่อมต่อ Apps Script ไม่สำเร็จ"
              )
            );

          },
          15000
        );

    }
  );

}


// =====================================================
// เช็ก Barcode ซ้ำทันที
// =====================================================

async function checkBarcodeImmediately(
  barcode
) {

  barcode =
    String(
      barcode || ""
    ).trim();


  if (!barcode) {

    return false;

  }


  try {

    const result =
      await callAppsScript({

        action:
          "check",

        barcode:
          barcode

      });


    if (
      result &&
      result.success &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      return true;

    }


    if (
      result &&
      result.success === false
    ) {

      console.error(
        "Check error:",
        result.message
      );


      return false;

    }


    return false;

  } catch (error) {

    console.error(
      "Check barcode error:",
      error
    );


    showMessage(
      "เช็ก Barcode ไม่สำเร็จ: " +
      error.message,
      false
    );


    return false;

  }

}

async function startCamera() {

  // ---------------------------------------------------
  // ป้องกันกดเปิดซ้ำระหว่างกำลังเปิด
  // ---------------------------------------------------

  if (cameraStarting) {

    return;

  }


  cameraStarting =
    true;


  // ---------------------------------------------------
  // เปิดกล้องใหม่ = ล้างข้อความเก่า
  // ---------------------------------------------------

  clearMessage();


  // ---------------------------------------------------
  // ปิดกล้องเก่าให้หมด
  // ---------------------------------------------------

  stopCamera();


  // ---------------------------------------------------
  // รอให้ iPhone ปล่อยกล้องเก่า
  // ---------------------------------------------------

  await wait(
    800
  );


  scanHandled =
    false;


  try {

    // -------------------------------------------------
    // ตรวจ ZXing
    // -------------------------------------------------

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "โหลดระบบสแกน Barcode ไม่สำเร็จ"
      );

    }


    // -------------------------------------------------
    // แสดงกล่องกล้อง
    // -------------------------------------------------

    cameraBox.style.display =
      "block";


    // -------------------------------------------------
    // สร้าง Reader ใหม่ทุกครั้ง
    // -------------------------------------------------

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    // -------------------------------------------------
    // ล้าง Video ก่อนเปิดใหม่
    // -------------------------------------------------

    try {

      video.pause();

      video.srcObject =
        null;

      video.removeAttribute(
        "src"
      );

      video.load();

    } catch (error) {

      console.log(
        "Video prepare:",
        error
      );

    }


    // -------------------------------------------------
    // ข้อกำหนดกล้อง
    // ใช้กล้องหลัง
    // -------------------------------------------------

    const constraints = {

      audio:
        false,

      video: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          ideal:
            1280

        },

        height: {

          ideal:
            720

        }

      }

    };


    // -------------------------------------------------
    // เปิดกล้อง
    // -------------------------------------------------

    cameraControls =
      await codeReader
        .decodeFromConstraints(

          constraints,

          video,

          async function(
            result,
            error
          ) {

            // -----------------------------------------
            // ยังไม่มี Barcode
            // -----------------------------------------

            if (!result) {

              return;

            }


            // -----------------------------------------
            // ป้องกัน callback ซ้ำ
            // -----------------------------------------

            if (scanHandled) {

              return;

            }


            scanHandled =
              true;


            // -----------------------------------------
            // อ่าน Barcode
            // -----------------------------------------

            const code =
              String(
                result.getText() ||
                ""
              ).trim();


            if (!code) {

              scanHandled =
                false;

              return;

            }


            // -----------------------------------------
            // ใส่ Barcode ในช่อง
            // -----------------------------------------

            barcodeInput.value =
              code;


            // -----------------------------------------
            // หยุดกล้องทันที
            // -----------------------------------------

            stopCamera();


            // -----------------------------------------
            // เช็กซ้ำทันที
            // -----------------------------------------

            const duplicate =
              await checkBarcodeImmediately(
                code
              );


            // -----------------------------------------
            // ถ้าไม่ซ้ำ
            // -----------------------------------------

            if (!duplicate) {

              showMessage(
                "✅ สแกนสำเร็จ: " +
                code,
                true
              );

            }

          }

        );


    // -------------------------------------------------
    // พยายามตั้ง Autofocus
    // -------------------------------------------------

    await wait(
      700
    );


    try {

      if (
        video.srcObject
      ) {

        const tracks =
          video.srcObject
            .getVideoTracks();


        if (
          tracks &&
          tracks.length > 0
        ) {

          const track =
            tracks[0];


          if (
            track.getCapabilities
          ) {

            const capabilities =
              track.getCapabilities();


            // ---------------------------------------
            // Continuous autofocus
            // ---------------------------------------

            if (
              capabilities.focusMode &&
              Array.isArray(
                capabilities.focusMode
              )
            ) {

              if (
                capabilities.focusMode
                  .includes(
                    "continuous"
                  )
              ) {

                try {

                  await track
                    .applyConstraints({

                      advanced: [

                        {
                          focusMode:
                            "continuous"
                        }

                      ]

                    });

                } catch (focusError) {

                  console.log(
                    "Continuous focus not supported:",
                    focusError
                  );

                }

              }

            }


            // ---------------------------------------
            // เปิดความละเอียดสูงถ้ารองรับ
            // ---------------------------------------

            try {

              if (
                capabilities.width &&
                capabilities.width.max
              ) {

                await track
                  .applyConstraints({

                    width: {
                      ideal: 1280
                    },

                    height: {
                      ideal: 720
                    }

                  });

              }

            } catch (resolutionError) {

              console.log(
                "Resolution setting skipped:",
                resolutionError
              );

            }

          }

        }

      }

    } catch (focusError) {

      console.log(
        "Focus setup skipped:",
        focusError
      );

    }


    // -------------------------------------------------
    // ให้กล้องเริ่มนิ่งก่อน
    // -------------------------------------------------

    await wait(
      800
    );


    // -------------------------------------------------
    // บังคับเล่น Video
    // -------------------------------------------------

    try {

      await video.play();

    } catch (playError) {

      console.log(
        "Video play:",
        playError
      );

    }


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    stopCamera();


    showMessage(
      "เปิดกล้องไม่ได้: " +
      (
        error.message ||
        error
      ),
      false
    );


  } finally {

    cameraStarting =
      false;

  }

}


// =====================================================
// ฟังก์ชันรอ
// =====================================================

function wait(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


// =====================================================
// ปุ่มปิดกล้อง
// =====================================================

stopCameraButton.addEventListener(
  "click",
  function() {

    stopCamera();

  }
);


// =====================================================
// ปิดกล้องแบบสมบูรณ์
// =====================================================

function stopCamera() {

  // ---------------------------------------------------
  // ป้องกัน callback จากกล้องเก่า
  // ---------------------------------------------------

  scanHandled =
    true;


  // ---------------------------------------------------
  // หยุด ZXing
  // ---------------------------------------------------

  try {

    if (cameraControls) {

      cameraControls.stop();

      cameraControls =
        null;

    }

  } catch (error) {

    console.log(
      "cameraControls.stop:",
      error
    );

  }


  // ---------------------------------------------------
  // Reset ZXing Reader
  // ---------------------------------------------------

  try {

    if (codeReader) {

      codeReader.reset();

      codeReader =
        null;

    }

  } catch (error) {

    console.log(
      "codeReader.reset:",
      error
    );


    codeReader =
      null;

  }


  // ---------------------------------------------------
  // หยุดกล้องจริงทุก Track
  // ---------------------------------------------------

  try {

    if (
      video.srcObject
    ) {

      const stream =
        video.srcObject;


      const tracks =
        stream.getTracks();


      tracks.forEach(
        function(track) {

          try {

            track.stop();

          } catch (error) {

            console.log(
              "track.stop:",
              error
            );

          }

        }
      );


      video.srcObject =
        null;

    }

  } catch (error) {

    console.log(
      "stream stop:",
      error
    );

  }


  // ---------------------------------------------------
  // Reset video element
  // ---------------------------------------------------

  try {

    video.pause();

    video.srcObject =
      null;

    video.removeAttribute(
      "src"
    );

    video.load();

  } catch (error) {

    console.log(
      "video reset:",
      error
    );

  }


  // ---------------------------------------------------
  // ซ่อนกล้อง
  // ---------------------------------------------------

  cameraBox.style.display =
    "none";

}


// =====================================================
// บันทึกข้อมูล
// =====================================================

saveButton.addEventListener(
  "click",
  saveData
);


async function saveData() {

  const fullName =
    fullNameInput.value.trim();


  const nickname =
    nicknameInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  // ---------------------------------------------------
  // ตรวจพนักงาน
  // ---------------------------------------------------

  if (!fullName) {

    showMessage(
      "กรุณาเลือกพนักงานก่อน",
      false
    );

    return;

  }


  // ---------------------------------------------------
  // ตรวจ Barcode
  // ---------------------------------------------------

  if (!barcode) {

    showMessage(
      "กรุณาสแกนหรือกรอกเลขพัสดุ",
      false
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  try {

    // -------------------------------------------------
    // เช็กซ้ำก่อนบันทึกอีกครั้ง
    // -------------------------------------------------

    const duplicate =
      await checkBarcodeImmediately(
        barcode
      );


    if (duplicate) {

      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // -------------------------------------------------
    // ส่งข้อมูลไป Apps Script
    // -------------------------------------------------

    const result =
      await callAppsScript({

        action:
          "save",

        fullName:
          fullName,

        nickname:
          nickname,

        barcode:
          barcode

      });


    // -------------------------------------------------
    // Backend แจ้งว่าซ้ำ
    // -------------------------------------------------

    if (
      result &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // -------------------------------------------------
    // บันทึกสำเร็จ
    // -------------------------------------------------

    if (
      result &&
      result.success
    ) {

      showMessage(
        "✅ บันทึกสำเร็จ: " +
        barcode,
        true
      );


      // ล้าง Barcode
      barcodeInput.value =
        "";


      // โหลดประวัติใหม่
      await loadHistory();


    } else {

      showMessage(
        result &&
        result.message
          ? result.message
          : "บันทึกข้อมูลไม่สำเร็จ",
        false
      );

    }


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    showMessage(
      "เชื่อมต่อระบบไม่ได้: " +
      error.message,
      false
    );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "💾 บันทึกข้อมูล";

}


// =====================================================
// โหลดประวัติ
// =====================================================

async function loadHistory() {

  historyList.innerHTML =
    '<div class="empty">' +
    'กำลังโหลดข้อมูล...' +
    '</div>';


  try {

    const result =
      await callAppsScript({

        action:
          "history",

        limit:
          "20"

      });


    // -------------------------------------------------
    // ไม่มีข้อมูล
    // -------------------------------------------------

    if (
      !result ||
      !result.success ||
      !result.items ||
      result.items.length === 0
    ) {

      historyList.innerHTML =
        '<div class="empty">' +
        'ยังไม่มีข้อมูลการสแกน' +
        '</div>';


      return;

    }


    historyList.innerHTML =
      "";


    // -------------------------------------------------
    // แสดงประวัติ
    // -------------------------------------------------

    result.items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        const barcode =
          document.createElement(
            "div"
          );


        barcode.className =
          "history-barcode";


        barcode.textContent =
          item.barcode ||
          "";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "history-name";


        let nameText =
          item.fullName ||
          "";


        if (
          item.nickname
        ) {

          nameText +=
            " (" +
            item.nickname +
            ")";

        }


        name.textContent =
          nameText;


        const time =
          document.createElement(
            "div"
          );


        time.className =
          "history-time";


        time.textContent =
          (
            item.date ||
            ""
          ) +
          " " +
          (
            item.time ||
            ""
          );


        div.appendChild(
          barcode
        );


        div.appendChild(
          name
        );


        div.appendChild(
          time
        );


        historyList.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(
      "History error:",
      error
    );


    historyList.innerHTML =
      '<div class="empty">' +
      'โหลดประวัติไม่สำเร็จ: ' +
      error.message +
      '</div>';

  }

}


// =====================================================
// แจ้งเตือนทั่วไป
// =====================================================

function showMessage(
  text,
  success
) {

  messageBox.textContent =
    text;


  messageBox.className =
    success
      ? "success"
      : "error";


  messageBox.style.display =
    "block";

}


// =====================================================
// แจ้งเตือน Barcode ซ้ำ
// ค้างไว้จนกว่าจะเปิดกล้องใหม่
// =====================================================

function showPermanentWarning(
  text,
  barcode
) {

  messageBox.textContent =
    text +
    " " +
    barcode;


  messageBox.className =
    "warning";


  messageBox.style.display =
    "block";

}


// =====================================================
// ล้างข้อความ
// เรียกเฉพาะตอนกดเปิดกล้องใหม่
// =====================================================

function clearMessage() {

  messageBox.textContent =
    "";


  messageBox.className =
    "";


  messageBox.style.display =
    "none";

}


// =====================================================
// เริ่มต้นระบบ
// =====================================================

loadHistory();


</script>
