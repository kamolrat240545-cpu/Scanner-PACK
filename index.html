    * {
      box-sizing: border-box;
    }


    html,
    body {

      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        Arial,

      color: #111;

      padding: 10px;
    }


    .container {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      background: #ffffff;

      padding: 20px;

      box-shadow:

    h1 {

      text-align: center;

      margin:
        5px 0 25px 0;

      font-size: 30px;

    }


    label {

      display: block;

      margin-top: 18px;

    #message {

      margin-top: 18px;

      padding: 16px;

       ประวัติ

    }

<script>

// =====================================================
// ตัวแปรกล้อง
// =====================================================

let codeReader = null;

let cameraControls = null;

let cameraStarting = false;

let scanHandled = false;


// =====================================================
// Element
// =====================================================

const employeeSelect =
  document.getElementById(
    "employee"
  );


const fullNameInput =
  document.getElementById(
    "fullName"
  );


const nicknameInput =
  document.getElementById(
    "nickname"
  );


const barcodeInput =
  document.getElementById(
    "barcode"
  );

  document.getElementById(
    "cameraButton"
  );

  document.getElementById(
    "stopCamera"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const cameraBox =
  document.getElementById(
    "cameraBox"
  );


const video =
  document.getElementById(
    "video"
  );


const messageBox =
  document.getElementById(
    "message"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


// =====================================================
// ใส่รายชื่อพนักงาน
// =====================================================

employees.forEach(
  function(person, index) {

    const option =
      document.createElement(
        "option"
      );


    option.value =

    option.textContent =
      person[0] +
      " (" +

      ")";


    employeeSelect.appendChild(
      option
    );

  }
);


// =====================================================
// เลือกพนักงาน
// =====================================================

employeeSelect.addEventListener(
  "change",
  function() {

    const index =
      this.value;


    if (index === "") {

      fullNameInput.value =
        "";

      nicknameInput.value =
        "";

      return;

    }


    const person =
      employees[
        Number(index)
      ];


    if (!person) {

      fullNameInput.value =
        "";

      nicknameInput.value =
        "";

      return;

    }


    fullNameInput.value =
      person[0];


    nicknameInput.value =
      person[1];

  }
);


// =====================================================
// JSONP
// =====================================================

function callAppsScript(
  params
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      let timeoutId =
        null;


      function cleanup() {

        if (timeoutId) {

          clearTimeout(
            timeoutId
          );

          timeoutId =
            null;

        }


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          resolve(
            data
          );

        };


      params.callback =
        callbackName;


      const query =
        new URLSearchParams();


      Object.keys(params)
        .forEach(
          function(key) {

            query.append(
              key,
              params[key]
            );

          }
        );


      script.src =
        WEB_APP_URL +
        "?" +
        query.toString();


      script.async =
        true;


      script.onerror =
        function() {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "Load failed"
            )
          );

        };


      document.body.appendChild(
        script
      );


      timeoutId =
        setTimeout(
          function() {

            if (finished) {

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "เชื่อมต่อ Apps Script ไม่สำเร็จ"
              )
            );

          },
          15000
        );

    }
  );

}


// =====================================================
// เช็ก Barcode ซ้ำทันทีหลังสแกน
// =====================================================

async function checkBarcodeImmediately(
  barcode
) {

  barcode =
    String(
      barcode || ""
    ).trim();


  if (!barcode) {

    return false;

  }


  try {

    const result =
      await callAppsScript({

        action:
          "check",

        barcode:
          barcode

      });


    if (
      result &&
      result.success &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      return true;

    }


    return false;

  } catch (error) {

    console.error(
      "Check barcode error:",
      error
    );


    showMessage(
      "เช็ก Barcode ไม่สำเร็จ: " +
      error.message,
      false
    );


    return false;

  }

}


// =====================================================
// เปิดกล้อง
// =====================================================

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  if (cameraStarting) {

    return;

  }


  cameraStarting =
    true;


  // เปิดกล้องใหม่ = ล้างแจ้งเตือนเก่า
  clearMessage();


  // ปิดกล้องเก่า
  stopCamera();


  // รอให้ iPhone ปล่อยกล้องเดิม
  await wait(800);


  scanHandled =
    false;


  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "โหลดระบบสแกน Barcode ไม่สำเร็จ"
      );

    }


    // แสดงกล้อง
    cameraBox.style.display =
      "block";


    // สร้าง Reader ใหม่ทุกครั้ง
    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    // ล้าง video เดิม
    try {

      video.pause();

      video.srcObject =
        null;

      video.removeAttribute(
        "src"
      );

      video.load();

    } catch (error) {

      console.log(
        "Video prepare:",
        error
      );

    }


    // ใช้กล้องหลัง
    const constraints = {

      audio:
        false,

      video: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          ideal:
            1280

        },

        height: {

          ideal:
            720

        }

      }

    };


    // เปิดกล้อง
    cameraControls =
      await codeReader
        .decodeFromConstraints(

          constraints,

          video,

          async function(
            result
          ) {

            if (!result) {

              return;

            }


            if (scanHandled) {

              return;

            }


            scanHandled =
              true;


            // อ่าน Barcode
            const code =
              String(
                result.getText() ||
                ""
              ).trim();


            if (!code) {

              scanHandled =
                false;

              return;

            }


            // ใส่ Barcode
            barcodeInput.value =
              code;


            // ปิดกล้องทันที
            stopCamera();


            // เช็กซ้ำทันที
            const duplicate =
              await checkBarcodeImmediately(
                code
              );


            // ถ้าไม่ซ้ำ
            if (!duplicate) {

              showMessage(
                "✅ สแกนสำเร็จ: " +
                code,
                true
              );

            }

          }

        );


    // รอให้กล้องเริ่มทำงาน
    await wait(700);


    // ตั้ง autofocus ถ้ารองรับ
    try {

      if (
        video.srcObject
      ) {

        const tracks =
          video.srcObject
            .getVideoTracks();


        if (
          tracks &&
          tracks.length > 0
        ) {

          const track =
            tracks[0];


          if (
            track.getCapabilities
          ) {

            const capabilities =
              track.getCapabilities();


            if (
              capabilities.focusMode &&
              Array.isArray(
                capabilities.focusMode
              )
            ) {

              if (
                capabilities.focusMode
                  .includes(
                    "continuous"
                  )
              ) {

                try {

                  await track
                    .applyConstraints({

                      advanced: [

                        {
                          focusMode:
                            "continuous"
                        }

                      ]

                    });

                } catch (error) {

                  console.log(
                    "Focus setting skipped:",
                    error
                  );

                }

              }

            }

          }

        }

      }

    } catch (error) {

      console.log(
        "Focus setup skipped:",
        error
      );

    }


    // รอให้ภาพนิ่ง
    await wait(800);


    // บังคับเล่น video
    try {

      await video.play();

    } catch (error) {

      console.log(
        "Video play:",
        error
      );

    }


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    stopCamera();


    showMessage(
      "เปิดกล้องไม่ได้: " +
      (
        error.message ||
        error
      ),
      false
    );


  } finally {

    cameraStarting =
      false;

  }

}


// =====================================================
// ฟังก์ชันรอ
// =====================================================

function wait(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


// =====================================================
// ปุ่มปิดกล้อง
// =====================================================

stopCameraButton.addEventListener(
  "click",
  function() {

    stopCamera();

  }
);


// =====================================================
// ปิดกล้องแบบสมบูรณ์
// =====================================================

function stopCamera() {

  scanHandled =
    true;


  // หยุด ZXing
  try {

    if (cameraControls) {

      cameraControls.stop();

      cameraControls =
        null;

    }

  } catch (error) {

    console.log(
      "cameraControls.stop:",
      error
    );

  }


  // Reset Reader
  try {

    if (codeReader) {

      codeReader.reset();

      codeReader =
        null;

    }

  } catch (error) {

    console.log(
      "codeReader.reset:",
      error
    );


    codeReader =
      null;

  }


  // หยุดทุก Video Track
  try {

    if (
      video.srcObject
    ) {

      const stream =
        video.srcObject;


      const tracks =
        stream.getTracks();


      tracks.forEach(
        function(track) {

          try {

            track.stop();

          } catch (error) {

            console.log(
              "track.stop:",
              error
            );

          }

        }
      );


      video.srcObject =
        null;

    }

  } catch (error) {

    console.log(
      "stream stop:",
      error
    );

  }


  // Reset video
  try {

    video.pause();

    video.srcObject =
      null;

    video.removeAttribute(
      "src"
    );

    video.load();

  } catch (error) {

    console.log(
      "video reset:",
      error
    );

  }


  // ซ่อนกล้อง
  cameraBox.style.display =
    "none";

}

// บันทึกข้อมูล

  const fullName =
    fullNameInput.value.trim();

    nicknameInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  // ===================================================
  // ตรวจพนักงาน

  if (!fullName) {

    showMessage(
      "กรุณาเลือกพนักงานก่อน",
      false
    );

    return;

  }


  // ===================================================
  // ตรวจ Barcode
  // ===================================================

  if (!barcode) {

    showMessage(
      "กรุณาสแกนหรือกรอกเลขพัสดุ",
      false
    );

    return;

  }


  // ===================================================
  // ป้องกันกดซ้ำ
  // ===================================================

  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  try {

    /*
      ==================================================
      สำคัญ

      ตรงนี้ไม่เช็ก Barcode ซ้ำอีกแล้ว

      เพราะตอนสแกนเราเช็กไปแล้ว
      และรหัส.gs ตรวจซ้ำให้อีกครั้งตอนบันทึก

      ทำให้กดบันทึกเร็วขึ้น
      ==================================================
    */


    const result =
      await callAppsScript({

        action:
          "save",

        fullName:
          fullName,

        nickname:
          nickname,

        barcode:
          barcode

      });


    // =================================================
    // Backend แจ้งว่าซ้ำ
    // =================================================

    if (
      result &&
      result.duplicate
    ) {

      showPermanentWarning(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว:",
        barcode
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // =================================================
    // บันทึกสำเร็จ
    // =================================================

    if (
      result &&
      result.success
    ) {

      // -----------------------------------------------
      // ขึ้นสำเร็จทันที
      // ไม่รอโหลดประวัติ
      // -----------------------------------------------

      showMessage(
        "✅ บันทึกสำเร็จ: " +
        barcode,
        true
      );


      // -----------------------------------------------
      // ล้าง Barcode
      // -----------------------------------------------

      barcodeInput.value =
        "";


      /*
        -----------------------------------------------
        โหลดประวัติแบบเบื้องหลัง

        ผู้ใช้ไม่ต้องรอ
        -----------------------------------------------
      */

      loadHistory();


    } else {

      showMessage(
        result &&
        result.message
          ? result.message
          : "บันทึกข้อมูลไม่สำเร็จ",
        false
      );

    }


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    showMessage(
      "เชื่อมต่อระบบไม่ได้: " +
      error.message,
      false
    );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "💾 บันทึกข้อมูล";

}


// =====================================================
// โหลดประวัติ
// =====================================================

async function loadHistory() {

  try {

    const result =
      await callAppsScript({

        action:
          "history",

        limit:
          "20"

      });


    // =================================================
    // ไม่มีข้อมูล
    // =================================================

    if (
      !result ||
      !result.success ||
      !result.items ||
      result.items.length === 0
    ) {

      historyList.innerHTML =
        '<div class="empty">' +
        'ยังไม่มีข้อมูลการสแกน' +
        '</div>';

      return;

    }


    historyList.innerHTML =
      "";


    // =================================================
    // แสดงประวัติ
    // =================================================

    result.items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        const barcode =
          document.createElement(
            "div"
          );


        barcode.className =
          "history-barcode";


        barcode.textContent =
          item.barcode ||
          "";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "history-name";


        let nameText =
          item.fullName ||
          "";


        if (
          item.nickname
        ) {

          nameText +=
            " (" +
            item.nickname +
            ")";

        }


        name.textContent =
          nameText;


        const time =
          document.createElement(
            "div"
          );


        time.className =
          "history-time";


        time.textContent =
          (
            item.date ||
            ""
          ) +
          " " +
          (
            item.time ||
            ""
          );


        div.appendChild(
          barcode
        );


        div.appendChild(
          name
        );


        div.appendChild(
          time
        );


        historyList.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(
      "History error:",
      error
    );


    historyList.innerHTML =
      '<div class="empty">' +
      'โหลดประวัติไม่สำเร็จ: ' +
      error.message +
      '</div>';

  }

}


// =====================================================
// แจ้งเตือนทั่วไป
// =====================================================

function showMessage(
  text,
  success
) {

  messageBox.textContent =
    text;


  messageBox.className =
    success
      ? "success"
      : "error";


  messageBox.style.display =
    "block";

}


// =====================================================
// แจ้งเตือน Barcode ซ้ำ
// ค้างจนกว่าจะเปิดกล้องใหม่
// =====================================================

function showPermanentWarning(
  text,
  barcode
) {

  messageBox.textContent =
    text +
    " " +
    barcode;


  messageBox.className =
    "warning";


  messageBox.style.display =
    "block";

}


// =====================================================
// ล้างข้อความ
// จะล้างเมื่อกดเปิดกล้องใหม่
// =====================================================

function clearMessage() {

  messageBox.textContent =
    "";


  messageBox.className =
    "";


  messageBox.style.display =
    "none";

}


// =====================================================
// เริ่มระบบ
// =====================================================

loadHistory();


</script>
