<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ใช้ Deployment ล่าสุดของคุณ
   ========================================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwU89eZ30CefrnoZci7WAg4ykhC3clumnvtLLeX3aWxJLVGr9XCTUJJGDBlxWpf7K_s/exec";


/* =========================================================
   ตัวแปร
   ========================================================= */

let scanner = null;

let scannerControls = null;

let isScanning = false;

let scanLocked = false;


/* =========================================================
   Element
   ========================================================= */

const employee =
  document.getElementById("employee");

const nickname =
  document.getElementById("nickname");

const barcode =
  document.getElementById("barcode");

const resultBox =
  document.getElementById("resultBox");

const status =
  document.getElementById("status");

const openCamera =
  document.getElementById("openCamera");

const stopCamera =
  document.getElementById("stopCamera");

const saveButton =
  document.getElementById("saveButton");

const video =
  document.getElementById("video");

const historyBox =
  document.getElementById("history");


/* =========================================================
   เปลี่ยนชื่อเล่น
   ========================================================= */

employee.addEventListener(
  "change",
  function() {

    const value =
      employee.value.split("|");

    nickname.textContent =
      value[1] || "-";

  }
);


/* =========================================================
   แสดงสถานะ
   ========================================================= */

function showStatus(message, type) {

  status.textContent =
    message;

  status.className =
    type || "";

}


/* =========================================================
   แสดง Barcode
   ========================================================= */

function showBarcode(code) {

  barcode.value =
    code;

  resultBox.style.display =
    "block";

  resultBox.textContent =
    "Barcode: " + code;

}


/* =========================================================
   JSONP
   GitHub Pages → Apps Script
   ========================================================= */

function jsonp(params, timeoutMs = 15000) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "jsonp_callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement("script");


      let finished = false;


      function cleanup() {

        if (script.parentNode) {

          script.parentNode
            .removeChild(script);

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      const timer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "หมดเวลารอ Google Apps Script"
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timer
          );


          cleanup();


          resolve(
            data
          );

        };


      const query =
        new URLSearchParams({

          ...params,

          callback:
            callbackName

        });


      script.src =
        WEB_APP_URL +
        "?" +
        query.toString();


      script.async =
        true;


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timer
          );


          cleanup();


          reject(
            new Error(
              "เชื่อมต่อ Google Apps Script ไม่สำเร็จ"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   เสียง Barcode ซ้ำ
   ========================================================= */

function playAlertSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    oscillator.type =
      "square";


    oscillator.frequency.value =
      800;


    gainNode.gain.value =
      0.15;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      350
    );


  } catch (error) {

    console.log(
      "ไม่สามารถเล่นเสียงเตือนได้",
      error
    );

  }

}


/* =========================================================
   เสียงสแกนสำเร็จ
   ========================================================= */

function playSuccessSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1200;


    gainNode.gain.value =
      0.08;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      120
    );


  } catch (error) {

    console.log(
      "ไม่สามารถเล่นเสียงได้",
      error
    );

  }

}


/* =========================================================
   เปิดกล้อง
   ========================================================= */

openCamera.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  if (isScanning) {
    return;
  }


  try {

    showStatus(
      "กำลังเปิดกล้อง...",
      "info"
    );


    scanner =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้อง"
      );

    }


    /* เลือกกล้องหลัง */

    let selectedDevice =
      devices[
        devices.length - 1
      ];


    for (
      const device of devices
    ) {

      const label =
        String(
          device.label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        selectedDevice =
          device;

        break;

      }

    }


    /* ปลดล็อกสำหรับการสแกนรอบใหม่ */

    scanLocked =
      false;


    isScanning =
      true;


    openCamera.style.display =
      "none";


    stopCamera.style.display =
      "block";


    showStatus(
      "📷 กำลังสแกน...\n" +
      "เมื่ออ่านได้แล้วกล้องจะล็อกทันที",
      "info"
    );


    scannerControls =
      await scanner.decodeFromVideoDevice(

        selectedDevice.deviceId,

        video,

        function(result, error) {

          if (
            result &&
            !scanLocked
          ) {

            handleScanResult(
              result.getText()
            );

          }

        }

      );


  } catch (error) {

    console.error(
      error
    );


    isScanning =
      false;


    openCamera.style.display =
      "block";


    stopCamera.style.display =
      "none";


    showStatus(
      "❌ ไม่สามารถเปิดกล้องได้: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   สแกนสำเร็จ
   สแกน 1 ครั้ง → กล้องหยุดทันที
   ========================================================= */

function handleScanResult(text) {

  if (scanLocked) {
    return;
  }


  text =
    String(
      text || ""
    ).trim();


  if (!text) {
    return;
  }


  /* ล็อกทันที */

  scanLocked =
    true;


  /* ใส่ Barcode */

  showBarcode(
    text
  );


  /* เสียง */

  playSuccessSound();


  /* ปิดกล้อง */

  stopCameraFunction();


  /* แสดงข้อความ */

  showStatus(
    "🔒 สแกนสำเร็จ กล้องถูกล็อกแล้ว\n" +
    "เลขพัสดุ: " +
    text +
    "\nกรุณากดบันทึกข้อมูล",
    "success"
  );


  barcode.focus();

}


/* =========================================================
   ปิดกล้อง
   ========================================================= */

stopCamera.addEventListener(
  "click",
  stopCameraFunction
);


function stopCameraFunction() {

  try {

    if (
      scannerControls &&
      typeof scannerControls.stop ===
      "function"
    ) {

      scannerControls.stop();

    }

  } catch (error) {

    console.error(
      error
    );

  }


  try {

    if (video.srcObject) {

      const tracks =
        video.srcObject
          .getTracks();


      tracks.forEach(
        function(track) {

          track.stop();

        }
      );


      video.srcObject =
        null;

    }

  } catch (error) {

    console.error(
      error
    );

  }


  scannerControls =
    null;


  scanner =
    null;


  isScanning =
    false;


  openCamera.style.display =
    "block";


  stopCamera.style.display =
    "none";

}


/* =========================================================
   บันทึกข้อมูล
   ========================================================= */

saveButton.addEventListener(
  "click",
  saveData
);


async function saveData() {

  const selected =
    employee.value.split("|");


  const fullName =
    selected[0] || "";


  const nick =
    selected[1] || "";


  const code =
    barcode.value.trim();


  /* ตรวจชื่อ */

  if (!fullName) {

    showStatus(
      "❌ กรุณาเลือกผู้สแกน",
      "error"
    );

    return;

  }


  /* ตรวจ Barcode */

  if (!code) {

    showStatus(
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    barcode.focus();

    return;

  }


  /* ปุ่มกำลังบันทึก */

  saveButton.disabled =
    true;


  saveButton.textContent =
    "กำลังบันทึก...";


  showStatus(
    "กำลังบันทึกข้อมูล...",
    "info"
  );


  try {

    /* ส่งข้อมูลไป Apps Script */

    const result =
      await jsonp({

        action:
          "save",

        fullName:
          fullName,

        nickname:
          nick,

        barcode:
          code

      });


    saveButton.disabled =
      false;


    saveButton.textContent =
      "💾 บันทึกลง Google Sheet";


    /* =========================
       บันทึกสำเร็จ
       ========================= */

    if (
      result &&
      result.success === true
    ) {

      showStatus(
        "✅ บันทึกสำเร็จ\n" +
        "เลขพัสดุ: " +
        code,
        "success"
      );


      resultBox.style.display =
        "block";


      resultBox.textContent =
        "บันทึกแล้ว: " +
        result.barcode;


      /* ล้าง Barcode */

      barcode.value =
        "";


      /* โหลดประวัติ */

      loadHistory();


      barcode.focus();

    }


    /* =========================
       Barcode ซ้ำ
       ========================= */

    else if (
      result &&
      result.duplicate
    ) {

      showStatus(
        "⚠️ Barcode ซ้ำ!\n" +
        "เลขพัสดุ: " +
        code +
        "\nรายการนี้มีอยู่ในระบบแล้ว",
        "error"
      );


      playAlertSound();


      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        "เลขพัสดุ: " +
        code +
        "\n\n" +
        "รายการนี้มีอยู่ใน Google Sheet แล้ว"
      );


      barcode.value =
        "";


      barcode.focus();

    }


    /* =========================
       Error
       ========================= */

    else {

      showStatus(
        "❌ " +
        (
          result &&
          result.message
            ? result.message
            : "บันทึกไม่สำเร็จ"
        ),
        "error"
      );

    }


  } catch (error) {

    saveButton.disabled =
      false;


    saveButton.textContent =
      "💾 บันทึกลง Google Sheet";


    showStatus(
      "❌ เกิดข้อผิดพลาด: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   กด Enter เพื่อบันทึก
   ========================================================= */

barcode.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      saveData();

    }

  }
);


/* =========================================================
   โหลดประวัติ
   ========================================================= */

function loadHistory() {

  jsonp({

    action:
      "history",

    limit:
      "20"

  })

  .then(
    function(result) {

      if (
        !result ||
        !result.success
      ) {

        historyBox.innerHTML =
          "❌ ไม่สามารถโหลดข้อมูลได้";

        return;

      }


      const items =
        result.items || [];


      if (
        items.length === 0
      ) {

        historyBox.innerHTML =
          "ยังไม่มีรายการสแกน";

        return;

      }


      historyBox.innerHTML =
        "";


      items.forEach(
        function(item) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "history-item";


          const barcodeDiv =
            document.createElement(
              "div"
            );


          barcodeDiv.className =
            "history-barcode";


          barcodeDiv.textContent =
            "📦 " +
            item.barcode;


          const nameDiv =
            document.createElement(
              "div"
            );


          nameDiv.className =
            "history-name";


          nameDiv.textContent =
            "👤 " +
            item.fullName +
            " (" +
            (
              item.nickname ||
              "-"
            ) +
            ")";


          const timeDiv =
            document.createElement(
              "div"
            );


          timeDiv.className =
            "history-time";


          timeDiv.textContent =
            "🕐 " +
            item.date +
            " " +
            item.time;


          div.appendChild(
            barcodeDiv
          );


          div.appendChild(
            nameDiv
          );


          div.appendChild(
            timeDiv
          );


          historyBox.appendChild(
            div
          );

        }
      );

    }
  )

  .catch(
    function(error) {

      historyBox.innerHTML =
        "❌ โหลดข้อมูลไม่สำเร็จ";

      console.error(
        error
      );

    }
  );

}


/* =========================================================
   เมื่อเปิดหน้าเว็บ
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    const selected =
      employee.value.split("|");


    nickname.textContent =
      selected[1] || "-";


    loadHistory();


    barcode.focus();

  }
);


/* =========================================================
   ก่อนออกจากหน้า
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCameraFunction();

  }
);

</script>
