<html lang="th">
<head>

  <style>
    * {

    }

    body {
      margin: 0;

      background: #f4f7fa;
      color: #172033;

    .container {

      margin: 0 auto;

    }

    h1 {

      margin: 10px 0 22px;

    }

    .card {
      background: #f8fafc;
      border-radius: 24px;

      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: 700;

    }

      border: 1px solid #cbd5e1;

      background: white;
      font-size: 19px;

    }

    }

      border-radius: 18px;
    }

    .camera-buttons {

      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-camera {
      flex: 1;
      background: #2563eb;
      color: white;
    }

    .btn-stop {
      flex: 1;
      background: #64748b;
      color: white;
    }

    .btn-save {
      width: 100%;
      background: #16a34a;
      color: white;
      font-size: 22px;
      padding: 18px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #52647a;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .status {
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      margin: 18px 0;
      min-height: 28px;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    .info {
      color: #2563eb;
    }

    .history-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .history {

    }

    table {

      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {

    }

    th {
      background: #e2e8f0;

    .empty {
      text-align: center;

      padding: 20px;
    }

    @media (max-width: 600px) {

      .container {

      }

        padding: 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 25px;
      }

        font-size: 18px;
      }

      select,
      input {
        font-size: 17px;
      }

      button {
        font-size: 17px;
      }
    }
  </style>

<script>

  // =========================================================
  // Google Apps Script Web App
  // =========================================================

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbyJhGYBitY8axfA7PDnWLs7f2A3hZsbb8362Bunp0aKWQ_0BJt2HshfvERH3EO_RZ60/exec";


  // =========================================================
  // ตัวแปรกล้อง
  // =========================================================

  let codeReader = null;

  let selectedDeviceId = null;

  let cameraRunning = false;

  let lastScannedCode = "";

  let lastScanTime = 0;


  // =========================================================
  // Element ต่าง ๆ
  // =========================================================

  const employeeEl =
    document.getElementById("employee");

  const nicknameEl =
    document.getElementById("nickname");

  const barcodeEl =
    document.getElementById("barcode");

  const statusEl =
    document.getElementById("status");

  const startBtn =
    document.getElementById("startCamera");

  const stopBtn =
    document.getElementById("stopCamera");

  const readerEl =
    document.getElementById("reader");


  // =========================================================
  // แสดงชื่อเล่น
  // =========================================================

  employeeEl.addEventListener(
    "change",
    function () {

      if (!this.value) {

        nicknameEl.textContent =
          "ชื่อเล่น: -";

        return;
      }

      const parts =
        this.value.split("|");

      nicknameEl.textContent =
        "ชื่อเล่น: " +
        (parts[1] || "-");

    }
  );


  // =========================================================
  // แสดงสถานะ
  // =========================================================

  function showStatus(message, type) {

    statusEl.textContent = message;

    statusEl.className =
      "status " + (type || "");

  }


  // =========================================================
  // ตรวจสอบ ZXing
  // =========================================================

  function checkZXing() {

    if (
      !window.ZXingBrowser
    ) {

      showStatus(
        "❌ โหลดระบบกล้องไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ",
        "error"
      );

      return false;
    }

    return true;
  }


  // =========================================================
  // เปิดกล้อง
  // =========================================================

  async function startCamera() {

    if (cameraRunning) {
      return;
    }

    if (!checkZXing()) {
      return;
    }

    try {

      showStatus(
        "กำลังเปิดกล้อง...",
        "info"
      );


      // สร้างตัวอ่าน Barcode

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      // หาอุปกรณ์กล้อง

      const devices =
        await ZXingBrowser.BrowserCodeReader
          .listVideoInputDevices();


      if (
        !devices ||
        devices.length === 0
      ) {

        throw new Error(
          "ไม่พบกล้องในอุปกรณ์"
        );
      }


      // =====================================================
      // เลือกกล้องหลัง
      // =====================================================

      const rearCamera =
        devices.find(
          device => {

            const label =
              (
                device.label || ""
              ).toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment") ||
              label.includes("หลัง")
            );

          }
        );


      selectedDeviceId =
        rearCamera
          ? rearCamera.deviceId
          : devices[devices.length - 1].deviceId;


      // =====================================================
      // สร้าง video
      // =====================================================

      readerEl.innerHTML =
        '<video id="video" playsinline></video>';


      const videoEl =
        document.getElementById("video");


      // =====================================================
      // เริ่มอ่าน Barcode
      // =====================================================

      await codeReader.decodeFromVideoDevice(

        selectedDeviceId,

        videoEl,

        (result, error) => {

          if (result) {

            const text =
              result.getText().trim();


            const now =
              Date.now();


            // ป้องกันการสแกนซ้ำ

            if (
              text &&
              (
                text !== lastScannedCode ||
                now - lastScanTime > 2500
              )
            ) {

              lastScannedCode =
                text;

              lastScanTime =
                now;


              // ใส่ Barcode ลงช่อง

              barcodeEl.value =
                text;


              showStatus(
                "✅ อ่าน Barcode ได้แล้ว: " + text,
                "success"
              );


              // หยุดกล้องหลังอ่านสำเร็จ

              stopCamera();

            }

          }

        }

      );


      cameraRunning = true;

      startBtn.disabled = true;

      stopBtn.disabled = false;


      showStatus(
        "📷 เปิดกล้องแล้ว นำ Barcode มาไว้ตรงกลางกล้อง",
        "info"
      );

    }

    catch (err) {

      console.error(err);


      cameraRunning = false;

      startBtn.disabled = false;

      stopBtn.disabled = true;


      let message =
        "❌ ไม่สามารถเปิดกล้องได้";


      if (
        err &&
        err.message
      ) {

        const errorText =
          err.message.toLowerCase();


        if (
          errorText.includes("permission") ||
          errorText.includes("denied")
        ) {

          message +=
            ": กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง";

        }

        else if (
          errorText.includes("not found")
        ) {

          message +=
            ": ไม่พบกล้อง";

        }

        else {

          message +=
            ": " + err.message;

        }

      }


      showStatus(
        message,
        "error"
      );

    }

  }


  // =========================================================
  // หยุดกล้อง
  // =========================================================

  function stopCamera() {

    try {

      if (codeReader) {

        codeReader.reset();

      }

    }

    catch (e) {

      console.log(e);

    }


    cameraRunning = false;

    startBtn.disabled = false;

    stopBtn.disabled = true;

  }


  // ปุ่มเปิดกล้อง

  startBtn.addEventListener(
    "click",
    startCamera
  );


  // ปุ่มหยุดกล้อง

  stopBtn.addEventListener(
    "click",
    stopCamera
  );


  // =========================================================
  // JSONP
  // ใช้ติดต่อ Google Apps Script จาก GitHub Pages
  // =========================================================

  function jsonp(
    params,
    timeoutMs = 15000
  ) {

    return new Promise(
      (resolve, reject) => {

        const callbackName =
          "jsonp_callback_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);


        const script =
          document.createElement("script");


        let finished = false;


        function cleanup() {

          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          try {

            delete window[
              callbackName
            ];

          }

          catch (e) {

            window[
              callbackName
            ] = undefined;

          }

        }


        const timer =
          setTimeout(
            () => {

              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "หมดเวลารอ Google Apps Script"
                )
              );

            },
            timeoutMs
          );


        window[callbackName] =
          function (data) {

            if (finished) {
              return;
            }

            finished = true;

            clearTimeout(timer);

            cleanup();

            resolve(data);

          };


        const query =
          new URLSearchParams({

            ...params,

            callback:
              callbackName

          });


        script.src =
          WEB_APP_URL +
          "?" +
          query.toString();


        script.async = true;


        script.onerror =
          function () {

            if (finished) {
              return;
            }

            finished = true;

            clearTimeout(timer);

            cleanup();

            reject(
              new Error(
                "เชื่อมต่อ Google Apps Script ไม่สำเร็จ"
              )
            );

          };


        document.body.appendChild(
          script
        );

      }
    );

  }


  // =========================================================
  // บันทึก Barcode
  // =========================================================

  async function saveScan() {

    const employeeValue =
      employeeEl.value;


    const barcode =
      barcodeEl.value.trim();


    // ตรวจสอบพนักงาน

    if (!employeeValue) {

      showStatus(
        "❌ กรุณาเลือกชื่อพนักงานก่อน",
        "error"
      );

      employeeEl.focus();

      return;
    }


    // ตรวจสอบ Barcode

    if (!barcode) {

      showStatus(
        "❌ กรุณาสแกนหรือกรอก Barcode ก่อน",
        "error"
      );

      barcodeEl.focus();

      return;
    }


    // แยกชื่อจริง / ชื่อเล่น

    const parts =
      employeeValue.split("|");


    const fullName =
      parts[0];


    const nickname =
      parts[1] || "";


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    saveButton.disabled = true;


    showStatus(
      "กำลังบันทึก...",
      "info"
    );


    try {

      const data =
        await jsonp({

          action: "save",

          fullName:
            fullName,

          nickname:
            nickname,

          barcode:
            barcode

        });


      if (
        data &&
        (
          data.ok === true ||
          data.success === true
        )
      ) {

        showStatus(
          "✅ บันทึกสำเร็จ: " +
          barcode,
          "success"
        );


        barcodeEl.value =
          "";


        lastScannedCode =
          "";


        loadHistory();


        barcodeEl.focus();

      }

      else {

        const msg =
          data &&
          (
            data.error ||
            data.message
          )
            ? (
                data.error ||
                data.message
              )
            : "Google Sheet ไม่ตอบกลับว่าสำเร็จ";


        showStatus(
          "❌ บันทึกไม่สำเร็จ: " +
          msg,
          "error"
        );

      }

    }

    catch (err) {

      console.error(err);


      showStatus(
        "❌ บันทึกไม่สำเร็จ: " +
        err.message,
        "error"
      );

    }

    finally {

      saveButton.disabled =
        false;

    }

  }


  // ปุ่มบันทึก

  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      saveScan
    );


  // =========================================================
  // กด Enter เพื่อบันทึก
  // =========================================================

  barcodeEl.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        saveScan();

      }

    }
  );


  // =========================================================
  // โหลดประวัติ
  // =========================================================

  async function loadHistory() {

    const historyEl =
      document.getElementById(
        "history"
      );


    try {

      const data =
        await jsonp({

          action:
            "history",

          limit:
            "20"

        });


      const rows =
        Array.isArray(data)
          ? data
          : (
              data &&
              Array.isArray(
                data.rows
              )
                ? data.rows
                : []
            );


      if (
        !rows.length
      ) {

        historyEl.innerHTML =
          '<div class="empty">ยังไม่มีรายการสแกน</div>';

        return;
      }


      let html = `

        <table>

          <thead>

            <tr>

              <th>วันที่</th>

              <th>เวลา</th>

              <th>ชื่อจริง</th>

              <th>ชื่อเล่น</th>

              <th>เลขพัสดุ</th>

            </tr>

          </thead>

          <tbody>

      `;


      rows.forEach(
        row => {

          const r =
            Array.isArray(row)
              ? row
              : [

                  row.date || "",

                  row.time || "",

                  row.fullName || "",

                  row.nickname || "",

                  row.barcode || ""

                ];


          html += `

            <tr>

              <td>
                ${escapeHtml(r[0] ?? "")}
              </td>

              <td>
                ${escapeHtml(r[1] ?? "")}
              </td>

              <td>
                ${escapeHtml(r[2] ?? "")}
              </td>

              <td>
                ${escapeHtml(r[3] ?? "")}
              </td>

              <td>
                ${escapeHtml(r[4] ?? "")}
              </td>

            </tr>

          `;

        }
      );


      html +=
        "</tbody></table>";


      historyEl.innerHTML =
        html;

    }

    catch (err) {

      console.error(err);


      historyEl.innerHTML =
        '<div class="empty">ไม่สามารถโหลดรายการล่าสุดได้</div>';

    }

  }


  // =========================================================
  // ป้องกัน HTML แปลก ๆ
  // =========================================================

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================================================
  // โหลดประวัติทันที
  // =========================================================

  loadHistory();

</script>

</body>
</html>
