<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบสแกน Barcode</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 26px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .camera-btn {
      background: #1976d2;
      color: white;
    }

    .save-btn {
      background: #2e7d32;
      color: white;
    }

    .stop-btn {
      background: #d32f2f;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      display: none;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .warning {
      background: #fff8e1;
      color: #ef6c00;
    }

    .barcode-display {
      margin-top: 15px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
    }

    .history-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .history-item {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-barcode {
      font-weight: bold;
      font-size: 16px;
    }

    .history-info {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .status {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>📦 ระบบสแกน Barcode</h1>

    <label for="employee">เลือกพนักงาน</label>

    <select id="employee" onchange="updateEmployee()">

      <option value="">-- เลือกชื่อพนักงาน --</option>

      <option value="จุรีพร สุขพิพัฒน์|เฟิร์น">
        จุรีพร สุขพิพัฒน์ - เฟิร์น
      </option>

      <option value="วันวิสา เจริญโสภณ|ปาร์ตี้">
        วันวิสา เจริญโสภณ - ปาร์ตี้
      </option>

      <option value="ธัญวรัตน์ บุญวังทอง|โม">
        ธัญวรัตน์ บุญวังทอง - โม
      </option>

      <option value="กัลย์สุดา บุญยืน|แก้ว">
        กัลย์สุดา บุญยืน - แก้ว
      </option>

      <option value="SAW MYINT HTUN|ซอมี่">
        SAW MYINT HTUN - ซอมี่
      </option>

      <option value="ทิฆัมพร ละเอียด|แนน">
        ทิฆัมพร ละเอียด - แนน
      </option>

      <option value="เจต มานะพิมพ์|เจต">
        เจต มานะพิมพ์ - เจต
      </option>

      <option value="น้ำผึ้ง วรรณชิโนรส|ผึ้ง">
        น้ำผึ้ง วรรณชิโนรส - ผึ้ง
      </option>

      <option value="HTOO|ทู">
        HTOO - ทู
      </option>

      <option value="SAW DEN|แดน">
        SAW DEN - แดน
      </option>

      <option value="น้ำฝน ยังเอี่ยม|ฝน">
        น้ำฝน ยังเอี่ยม - ฝน
      </option>

      <option value="MIN CHIT SOE|มิน ชิท ซู">
        MIN CHIT SOE - มิน ชิท ซู
      </option>

      <option value="SAW MU (2)|ซอมู">
        SAW MU (2) - ซอมู
      </option>

      <option value="ZAYAR MYLNT|ซี ยา มิ">
        ZAYAR MYLNT - ซี ยา มิ
      </option>

      <option value="EH POE SAI|อิ โป ซาย">
        EH POE SAI - อิ โป ซาย
      </option>

      <option value="SAW SHEE|ซอชิ">
        SAW SHEE - ซอชิ
      </option>

      <option value="SOE WIN|บ่าววี">
        SOE WIN - บ่าววี
      </option>

      <option value="SAW TAR SI PAR|วิททูล">
        SAW TAR SI PAR - วิททูล
      </option>

      <option value="KYAW WIN NAING|วินัย">
        KYAW WIN NAING - วินัย
      </option>

      <option value="SAW MU (1)|ซอมู">
        SAW MU (1) - ซอมู
      </option>

      <option value="ชลิตา จกัลยา|ติ๊ก">
        ชลิตา จกัลยา - ติ๊ก
      </option>

      <option value="MYINT OO|มิอู">
        MYINT OO - มิอู
      </option>

      <option value="KAR KAR|กา กา">
        KAR KAR - กา กา
      </option>

      <option value="อมรรัตน์ เรืองลอยขำ|อ้อย">
        อมรรัตน์ เรืองลอยขำ - อ้อย
      </option>

      <option value="วิไลรัตน์ แก้วพิกุล|จุ๊">
        วิไลรัตน์ แก้วพิกุล - จุ๊
      </option>

      <option value="วันดี ยิ้มกัลป์|ดาว">
        วันดี ยิ้มกัลป์ - ดาว
      </option>

      <option value="LAY LAY|เล">
        LAY LAY - เล
      </option>

      <option value="THET HTAR AYE|เอ">
        THET HTAR AYE - เอ
      </option>

      <option value="SOE MIN OO|">
        SOE MIN OO
      </option>

      <option value="จีราวัฒน์ อ้อนวอน|บาส">
        จีราวัฒน์ อ้อนวอน - บาส
      </option>

      <option value="เอื้องแก้ว ธีรัชธรรมสรณ์|เอ็ม">
        เอื้องแก้ว ธีรัชธรรมสรณ์ - เอ็ม
      </option>

      <option value="HAN PHYO WAI|เว">
        HAN PHYO WAI - เว
      </option>

      <option value="อารี สูงขาว|นุ้ย">
        อารี สูงขาว - นุ้ย
      </option>

      <option value="YIN MAR NWAI|มาญ">
        YIN MAR NWAI - มาญ
      </option>

      <option value="SAW SHWE OESI|พี่แว่น">
        SAW SHWE OESI - พี่แว่น
      </option>

      <option value="หนูไกร อำภัยรัตน์|ไกร">
        หนูไกร อำภัยรัตน์ - ไกร
      </option>

      <option value="ปวีณา หลอดทอง|วี">
        ปวีณา หลอดทอง - วี
      </option>

      <option value="นันทญา แสงทอง|นัน">
        นันทญา แสงทอง - นัน
      </option>

      <option value="วันวิสา ลัภขุนทด|กิ่ง">
        วันวิสา ลัภขุนทด - กิ่ง
      </option>

      <option value="SAW MOE LAY|โม เล">
        SAW MOE LAY - โม เล
      </option>

    </select>


    <label>ชื่อจริง</label>

    <input
      type="text"
      id="fullName"
      readonly
      placeholder="ชื่อจริงจะแสดงตรงนี้"
    >


    <label>ชื่อเล่น</label>

    <input
      type="text"
      id="nickname"
      readonly
      placeholder="ชื่อเล่นจะแสดงตรงนี้"
    >


    <label>เลขพัสดุ</label>

    <input
      type="text"
      id="barcode"
      placeholder="สแกน Barcode หรือกรอกเลขพัสดุ"
      autocomplete="off"
    >


    <button
      class="camera-btn"
      id="cameraButton"
      onclick="openCamera()"
    >
      📷 เปิดกล้องสแกน
    </button>


    <div id="reader"></div>


    <button
      class="stop-btn"
      id="stopButton"
      onclick="stopCamera()"
      style="display:none;"
    >
      ⛔ ปิดกล้อง
    </button>


    <div
      id="barcodeDisplay"
      class="barcode-display"
      style="display:none;"
    ></div>


    <button
      class="save-btn"
      id="saveButton"
      onclick="saveBarcode()"
    >
      💾 บันทึกข้อมูล
    </button>


    <div id="result"></div>


    <div
      class="status"
      id="cameraStatus"
    ></div>

  </div>


  <div class="card">

    <div class="history-title">
      📋 รายการล่าสุด
    </div>

    <div id="history">
      กำลังโหลดข้อมูล...
    </div>

  </div>

</div>


<script>

/* =========================================================
   Google Apps Script Web App URL
   แก้เฉพาะ URL เป็น VERSION 8
   ========================================================= */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbwtXTuKW9rrieYl2h3vMXuRrG6eQEJkpykrTd2plLiB4oiiZ2WEXJOqufpKhyDAoMHH/exec";


/* =========================================================
   ตัวแปรกล้อง
   ========================================================= */

let codeReader = null;

let selectedDeviceId = null;

let cameraRunning = false;


/* =========================================================
   เลือกพนักงาน
   ========================================================= */

function updateEmployee() {

  const value =
    document.getElementById("employee").value;

  if (!value) {

    document.getElementById("fullName").value = "";

    document.getElementById("nickname").value = "";

    return;
  }

  const parts =
    value.split("|");

  document.getElementById("fullName").value =
    parts[0] || "";

  document.getElementById("nickname").value =
    parts[1] || "";
}


/* =========================================================
   เปิดกล้อง
   ========================================================= */

async function openCamera() {

  const employee =
    document.getElementById("employee").value;

  if (!employee) {

    showResult(
      "กรุณาเลือกพนักงานก่อนเปิดกล้อง",
      "error"
    );

    return;
  }


  document.getElementById("barcode").value = "";

  document.getElementById("barcodeDisplay").style.display =
    "none";


  const reader =
    document.getElementById("reader");

  reader.style.display = "block";


  document.getElementById("cameraButton").style.display =
    "none";

  document.getElementById("stopButton").style.display =
    "block";


  document.getElementById("cameraStatus").textContent =
    "กำลังเปิดกล้อง...";


  try {

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (!devices || devices.length === 0) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    const backCamera =
      devices.find(device =>
        /back|rear|environment|หลัง/i.test(
          device.label || ""
        )
      );


    selectedDeviceId =
      backCamera
        ? backCamera.deviceId
        : devices[devices.length - 1].deviceId;


    cameraRunning = true;


    document.getElementById("cameraStatus").textContent =
      "📷 กำลังสแกน...";


    await codeReader.decodeFromVideoDevice(
      selectedDeviceId,
      reader,
      (result, error) => {

        if (result) {

          const text =
            result.getText();

          document.getElementById("barcode").value =
            text;


          document.getElementById(
            "barcodeDisplay"
          ).textContent =
            "📦 " + text;

          document.getElementById(
            "barcodeDisplay"
          ).style.display =
            "block";


          stopCamera();


          showResult(
            "✅ สแกนสำเร็จ: " + text,
            "success"
          );

        }

      }
    );

  } catch (error) {

    console.error(error);

    stopCamera();

    showResult(
      "❌ ไม่สามารถเปิดกล้องได้: " +
      (error.message || error),
      "error"
    );

  }

}


/* =========================================================
   ปิดกล้อง
   ========================================================= */

function stopCamera() {

  cameraRunning = false;


  try {

    if (codeReader) {
      codeReader.reset();
    }

  } catch (error) {

    console.log(error);

  }


  codeReader = null;


  const reader =
    document.getElementById("reader");

  reader.innerHTML = "";

  reader.style.display = "none";


  document.getElementById("cameraButton").style.display =
    "block";

  document.getElementById("stopButton").style.display =
    "none";


  document.getElementById("cameraStatus").textContent =
    "กล้องปิดแล้ว — กดเปิดกล้องเพื่อสแกนพัสดุถัดไป";

}


/* =========================================================
   แสดงข้อความ
   ========================================================= */

function showResult(message, type) {

  const box =
    document.getElementById("result");

  box.textContent = message;

  box.className = type;

  box.style.display = "block";

}


/* =========================================================
   บันทึก Barcode ลง Google Sheets
   ========================================================= */

function saveBarcode() {

  const fullName =
    document.getElementById("fullName").value.trim();

  const nickname =
    document.getElementById("nickname").value.trim();

  const barcode =
    document.getElementById("barcode").value.trim();


  if (!fullName) {

    showResult(
      "❌ กรุณาเลือกพนักงาน",
      "error"
    );

    return;

  }


  if (!barcode) {

    showResult(
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("saveButton");

  button.disabled = true;

  button.textContent =
    "⏳ กำลังบันทึก...";


  showResult(
    "กำลังตรวจสอบข้อมูล...",
    "warning"
  );


  const callbackName =
    "saveCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  let finished = false;


  window[callbackName] =
    function(data) {

      finished = true;


      try {

        if (data && data.duplicate) {

          showResult(
            "⚠️ Barcode นี้มีอยู่ในระบบแล้ว: " +
            barcode,
            "warning"
          );

          return;

        }


        if (data && data.success) {

          showResult(
            "✅ บันทึกสำเร็จ: " +
            data.barcode,
            "success"
          );


          document.getElementById(
            "barcodeDisplay"
          ).textContent =
            "📦 " + data.barcode;


          document.getElementById(
            "barcodeDisplay"
          ).style.display =
            "block";


          document.getElementById(
            "barcode"
          ).value = "";


          loadHistory();


        } else {

          showResult(
            "❌ " +
            (
              data && data.message
                ? data.message
                : "ไม่สามารถบันทึกข้อมูลได้"
            ),
            "error"
          );

        }

      } finally {

        button.disabled = false;

        button.textContent =
          "💾 บันทึกข้อมูล";


        delete window[callbackName];


        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


  const url =
    GAS_URL +
    "?action=save" +
    "&fullName=" +
    encodeURIComponent(fullName) +
    "&nickname=" +
    encodeURIComponent(nickname) +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;


      finished = true;


      showResult(
        "❌ เชื่อมต่อ Google Apps Script ไม่สำเร็จ",
        "error"
      );


      button.disabled = false;

      button.textContent =
        "💾 บันทึกข้อมูล";


      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


  document.body.appendChild(script);


  setTimeout(function() {

    if (finished) return;


    finished = true;


    showResult(
      "❌ การเชื่อมต่อใช้เวลานานเกินไป",
      "error"
    );


    button.disabled = false;

    button.textContent =
      "💾 บันทึกข้อมูล";


    delete window[callbackName];


    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }, 15000);

}


/* =========================================================
   โหลดรายการล่าสุดจาก Google Sheets
   ========================================================= */

function loadHistory() {

  const history =
    document.getElementById("history");


  history.innerHTML =
    "กำลังโหลดข้อมูล...";


  const callbackName =
    "historyCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  let finished = false;


  window[callbackName] =
    function(data) {

      finished = true;


      try {

        if (!data || !data.success) {

          history.innerHTML =
            "❌ โหลดข้อมูลไม่สำเร็จ";

          return;

        }


        const items =
          data.items || [];


        if (items.length === 0) {

          history.innerHTML =
            "ยังไม่มีข้อมูล";

          return;

        }


        history.innerHTML =
          "";


        items.forEach(function(item) {

          const div =
            document.createElement("div");

          div.className =
            "history-item";


          const barcode =
            document.createElement("div");

          barcode.className =
            "history-barcode";

          barcode.textContent =
            "📦 " + item.barcode;


          const info =
            document.createElement("div");

          info.className =
            "history-info";

          info.textContent =
            item.date +
            " " +
            item.time +
            " | " +
            item.fullName +
            (
              item.nickname
                ? " (" + item.nickname + ")"
                : ""
            );


          div.appendChild(barcode);

          div.appendChild(info);

          history.appendChild(div);

        });


      } finally {

        delete window[callbackName];


        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


  const url =
    GAS_URL +
    "?action=history" +
    "&limit=20" +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;


      finished = true;


      history.innerHTML =
        "❌ โหลดข้อมูลไม่สำเร็จ";


      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


  document.body.appendChild(script);


  setTimeout(function() {

    if (finished) return;


    finished = true;


    history.innerHTML =
      "❌ โหลดข้อมูลไม่สำเร็จ";


    delete window[callbackName];


    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }, 15000);

}


/* =========================================================
   กด Enter ในช่อง Barcode
   ========================================================= */

document
  .getElementById("barcode")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      saveBarcode();

    }

  });


/* =========================================================
   โหลดประวัติเมื่อเปิดหน้าเว็บ
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    loadHistory();

  }
);

</script>

</body>
</html>
