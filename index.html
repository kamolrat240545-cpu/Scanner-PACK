<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

    name="viewport"

  <title>ระบบสแกน Barcode</title>


  <!-- ZXing Barcode Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px 10px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }


    .container {
      max-width: 650px;
      margin: 0 auto;
    }


    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }


    h1 {
      text-align: center;
      margin: 0 0 25px 0;
      font-size: 28px;
    }


    label {
      display: block;
      font-weight: bold;
      font-size: 18px;
      margin-top: 15px;
      margin-bottom: 7px;
    }


    select,
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      background: white;
    }


    input[readonly] {
      background: #fafafa;
    }


    button {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }


    button:disabled {
      opacity: 0.6;

    }


    .camera-btn {

      color: white;
    }


    .save-btn {
      background: #2e7d32;
      color: white;
    }


    .stop-btn {
      background: #d32f2f;
      color: white;
    }


    #reader {
      width: 100%;
      margin-top: 15px;
      display: none;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }


    #reader video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }


    #result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }


    #result.success {
      background: #e8f5e9;
      color: #2e7d32;
    }


    #result.error {
      background: #ffebee;
      color: #c62828;
    }


    #result.warning {

      color: #ef6c00;
    }


    .barcode-display {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f3f4;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      word-break: break-all;
    }


    .status {
      margin-top: 10px;
      text-align: center;
      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }


    .history-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }


    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }


    .history-item:last-child {
      border-bottom: none;
    }


    .history-barcode {
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }


    .history-info {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

  </style>

</head>

<script>


/* =========================================================
   GOOGLE APPS SCRIPT URL
   VERSION 8
   ========================================================= */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbwtXTuKW9rrieYl2h3vMXuRrG6eQEJkpykrTd2plLiB4oiiZ2WEXJOqufpKhyDAoMHH/exec";



/* =========================================================
   ตัวแปรกล้อง
   ========================================================= */

let codeReader = null;

let selectedDeviceId = null;

let cameraRunning = false;



/* =========================================================
   เลือกพนักงาน
   ========================================================= */

function updateEmployee() {


  const value =
    document.getElementById("employee").value;


  if (!value) {

    document.getElementById("fullName").value = "";

    document.getElementById("nickname").value = "";

    return;
  }


  const parts =
    value.split("|");


  document.getElementById("fullName").value =
    parts[0] || "";


  document.getElementById("nickname").value =
    parts[1] || "";

}



/* =========================================================
   เปิดกล้อง
   ========================================================= */

async function openCamera() {


  const employee =
    document.getElementById("employee").value;


  if (!employee) {

    showResult(
      "❌ กรุณาเลือกพนักงานก่อนเปิดกล้อง",
      "error"
    );

    return;
  }



  /* ล้าง Barcode เดิม */

  document.getElementById("barcode").value = "";


  document.getElementById(
    "barcodeDisplay"
  ).style.display = "none";



  /* พื้นที่กล้อง */

  const reader =
    document.getElementById("reader");


  reader.innerHTML = "";

  reader.style.display = "block";



  /* =====================================================
     สร้าง VIDEO โดยตรง
     แก้ปัญหา Couldn't get videoElement
     ===================================================== */

  const video =
    document.createElement("video");


  video.id =
    "scannerVideo";


  video.autoplay =
    true;


  video.muted =
    true;


  video.playsInline =
    true;


  video.setAttribute(
    "autoplay",
    ""
  );


  video.setAttribute(
    "muted",
    ""
  );


  video.setAttribute(
    "playsinline",
    ""
  );


  video.style.width =
    "100%";


  video.style.display =
    "block";


  reader.appendChild(video);



  /* ปุ่ม */

  document.getElementById(
    "cameraButton"
  ).style.display = "none";


  document.getElementById(
    "stopButton"
  ).style.display = "block";


  document.getElementById(
    "cameraStatus"
  ).textContent =
    "กำลังเปิดกล้อง...";



  try {


    /* ตรวจสอบ ZXing */

    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "ไม่พบ ZXing Barcode Scanner"
      );

    }



    /* สร้างตัวอ่าน Barcode */

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();



    /* หาอุปกรณ์กล้อง */

    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();



    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }



    /* ===================================================
       เลือกกล้องหลัง
       =================================================== */

    const backCamera =
      devices.find(
        function(device) {

          return /back|rear|environment|หลัง/i.test(
            device.label || ""
          );

        }
      );



    selectedDeviceId =
      backCamera
        ? backCamera.deviceId
        : devices[
            devices.length - 1
          ].deviceId;



    cameraRunning = true;



    document.getElementById(
      "cameraStatus"
    ).textContent =
      "📷 กำลังสแกน Barcode...";



    /* ===================================================
       เริ่มสแกน

       สำคัญ:
       ส่ง VIDEO เข้า ZXing
       ไม่ใช่ DIV
       =================================================== */

    await codeReader.decodeFromVideoDevice(

      selectedDeviceId,

      video,

      function(result, error) {


        /* ยังสแกนไม่เจอ */

        if (!result) {
          return;
        }



        /* ได้ Barcode */

        const text =
          result.getText().trim();



        if (!text) {
          return;
        }



        /* =================================================
           สแกนสำเร็จ
           ================================================= */

        document.getElementById(
          "barcode"
        ).value =
          text;



        document.getElementById(
          "barcodeDisplay"
        ).textContent =
          "📦 " + text;



        document.getElementById(
          "barcodeDisplay"
        ).style.display =
          "block";



        /* =================================================
           หยุดกล้องทันที
           ================================================= */

        stopCamera();



        showResult(
          "✅ สแกนสำเร็จ: " + text,
          "success"
        );

      }

    );


  } catch (error) {


    console.error(
      "Camera Error:",
      error
    );


    stopCamera();


    showResult(
      "❌ ไม่สามารถเปิดกล้องได้: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}



/* =========================================================
   ปิดกล้อง
   ========================================================= */

function stopCamera() {


  cameraRunning = false;



  /* หยุด ZXing */

  try {

    if (codeReader) {

      codeReader.reset();

    }

  } catch (error) {

    console.log(error);

  }



  codeReader = null;



  /* หยุดกล้องจริง */

  const reader =
    document.getElementById("reader");


  const videos =
    reader.querySelectorAll(
      "video"
    );


  videos.forEach(
    function(video) {


      try {


        if (video.srcObject) {


          const tracks =
            video.srcObject.getTracks();


          tracks.forEach(
            function(track) {

              track.stop();

            }
          );

        }


      } catch (error) {

        console.log(error);

      }

    }
  );



  /* ล้างพื้นที่กล้อง */

  reader.innerHTML = "";

  reader.style.display = "none";



  /* ปุ่ม */

  document.getElementById(
    "cameraButton"
  ).style.display = "block";


  document.getElementById(
    "stopButton"
  ).style.display = "none";



  document.getElementById(
    "cameraStatus"
  ).textContent =
    "กล้องปิดแล้ว — กดเปิดกล้องเพื่อสแกนพัสดุถัดไป";

}



/* =========================================================
   แสดงข้อความ
   ========================================================= */

function showResult(
  message,
  type
) {


  const box =
    document.getElementById(
      "result"
    );


  box.textContent =
    message;


  box.className =
    type;


  box.style.display =
    "block";

}



/* =========================================================
   บันทึก Barcode
   ========================================================= */

function saveBarcode() {


  const fullName =
    document.getElementById(
      "fullName"
    ).value.trim();


  const nickname =
    document.getElementById(
      "nickname"
    ).value.trim();


  const barcode =
    document.getElementById(
      "barcode"
    ).value.trim();



  /* ตรวจชื่อ */

  if (!fullName) {

    showResult(
      "❌ กรุณาเลือกพนักงาน",
      "error"
    );

    return;
  }



  /* ตรวจ Barcode */

  if (!barcode) {

    showResult(
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    return;
  }



  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;


  button.textContent =
    "⏳ กำลังบันทึก...";



  showResult(
    "กำลังตรวจสอบข้อมูล...",
    "warning"
  );



  /* =====================================================
     สร้าง JSONP Callback
     ===================================================== */

  const callbackName =
    "saveCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );



  const script =
    document.createElement(
      "script"
    );


  let finished = false;



  /* =====================================================
     รับผลจาก Google Apps Script
     ===================================================== */

  window[callbackName] =
    function(data) {


      finished = true;


      try {


        /* Barcode ซ้ำ */

        if (
          data &&
          data.duplicate
        ) {


          showResult(
            "⚠️ Barcode นี้มีอยู่ในระบบแล้ว: " +
            barcode,
            "warning"
          );


          return;

        }



        /* บันทึกสำเร็จ */

        if (
          data &&
          data.success
        ) {


          showResult(
            "✅ บันทึกสำเร็จ: " +
            data.barcode,
            "success"
          );



          /* แสดง Barcode */

          document.getElementById(
            "barcodeDisplay"
          ).textContent =
            "📦 " +
            data.barcode;


          document.getElementById(
            "barcodeDisplay"
          ).style.display =
            "block";



          /* ล้างช่อง Barcode */

          document.getElementById(
            "barcode"
          ).value = "";



          /* โหลดรายการล่าสุด */

          loadHistory();


        } else {


          showResult(
            "❌ " +
            (
              data &&
              data.message
                ? data.message
                : "ไม่สามารถบันทึกข้อมูลได้"
            ),
            "error"
          );

        }


      } finally {


        button.disabled = false;


        button.textContent =
          "💾 บันทึกข้อมูล";


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    };



  /* =====================================================
     สร้าง URL
     ===================================================== */

  const url =
    GAS_URL +
    "?action=save" +
    "&fullName=" +
    encodeURIComponent(
      fullName
    ) +
    "&nickname=" +
    encodeURIComponent(
      nickname
    ) +
    "&barcode=" +
    encodeURIComponent(
      barcode
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );



  script.src =
    url;



  /* =====================================================
     กรณีเชื่อมต่อไม่ได้
     ===================================================== */

  script.onerror =
    function() {


      if (finished) {
        return;
      }


      finished = true;



      showResult(
        "❌ เชื่อมต่อ Google Apps Script ไม่สำเร็จ",
        "error"
      );



      button.disabled = false;


      button.textContent =
        "💾 บันทึกข้อมูล";



      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };



  document.body.appendChild(
    script
  );



  /* =====================================================
     Timeout 15 วินาที
     ===================================================== */

  setTimeout(
    function() {


      if (finished) {
        return;
      }


      finished = true;



      showResult(
        "❌ การเชื่อมต่อใช้เวลานานเกินไป",
        "error"
      );



      button.disabled = false;


      button.textContent =
        "💾 บันทึกข้อมูล";



      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    },
    15000
  );

}



/* =========================================================
   โหลดรายการล่าสุด
   ========================================================= */

function loadHistory() {


  const history =
    document.getElementById(
      "history"
    );


  history.innerHTML =
    "กำลังโหลดข้อมูล...";



  /* =====================================================
     JSONP Callback
     ===================================================== */

  const callbackName =
    "historyCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );



  const script =
    document.createElement(
      "script"
    );


  let finished = false;



  window[callbackName] =
    function(data) {


      finished = true;


      try {


        /* โหลดไม่สำเร็จ */

        if (
          !data ||
          !data.success
        ) {


          history.innerHTML =
            "❌ โหลดข้อมูลไม่สำเร็จ";


          return;

        }



        const items =
          data.items || [];



        /* ยังไม่มีข้อมูล */

        if (
          items.length === 0
        ) {


          history.innerHTML =
            "ยังไม่มีข้อมูล";


          return;

        }



        history.innerHTML =
          "";



        /* แสดงรายการ */

        items.forEach(
          function(item) {


            const div =
              document.createElement(
                "div"
              );


            div.className =
              "history-item";



            const barcode =
              document.createElement(
                "div"
              );


            barcode.className =
              "history-barcode";


            barcode.textContent =
              "📦 " +
              item.barcode;



            const info =
              document.createElement(
                "div"
              );


            info.className =
              "history-info";


            info.textContent =
              item.date +
              " " +
              item.time +
              " | " +
              item.fullName +
              (
                item.nickname
                  ? " (" +
                    item.nickname +
                    ")"
                  : ""
              );



            div.appendChild(
              barcode
            );


            div.appendChild(
              info
            );


            history.appendChild(
              div
            );

          }
        );


      } finally {


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    };



  /* =====================================================
     URL History
     ===================================================== */

  const url =
    GAS_URL +
    "?action=history" +
    "&limit=20" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );



  script.src =
    url;



  /* =====================================================
     Error
     ===================================================== */

  script.onerror =
    function() {


      if (finished) {
        return;
      }


      finished = true;



      history.innerHTML =
        "❌ โหลดข้อมูลไม่สำเร็จ";



      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };



  document.body.appendChild(
    script
  );



  /* Timeout */

  setTimeout(
    function() {


      if (finished) {
        return;
      }


      finished = true;



      history.innerHTML =
        "❌ โหลดข้อมูลไม่สำเร็จ";



      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    },
    15000
  );

}

window.addEventListener(
