<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบสแกน Barcode</title>


  <!-- ZXing Barcode Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 15px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f5f5;
      color: #111;
    }


    .container {
      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      background: #fff;

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        0 3px 15px rgba(0,0,0,0.12);
    }


    h1 {
      text-align: center;

      margin-top: 0;
      margin-bottom: 25px;

      font-size: 30px;
    }


    label {
      display: block;

      margin-top: 18px;
      margin-bottom: 7px;

      font-size: 19px;
      font-weight: bold;
    }


    select,
    input {
      width: 100%;

      height: 58px;

      padding: 10px 16px;

      border:
        1px solid #ccc;

      border-radius: 12px;

      font-size: 18px;

      background: #fff;
    }


    input[readonly] {
      background: #f1f1f1;
    }


    button {
      width: 100%;

      height: 60px;

      margin-top: 15px;

      border: none;

      border-radius: 12px;

      color: white;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;
    }


    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }


    #cameraButton {
      background: #1976d2;
    }


    #stopCamera {
      background: #d32f2f;
    }


    #saveButton {
      background: #2e7d32;

      margin-top: 20px;
    }


    /* ==========================
       กล้อง
       ========================== */

    #cameraBox {
      display: none;

      width: 100%;

      margin-top: 15px;

      background: #000;

      border-radius: 12px;

      overflow: hidden;
    }


    #video {
      display: block;

      width: 100%;

      height: auto;

      background: #000;
    }


    /* ==========================
       ข้อความแจ้งเตือน
       ========================== */

    #message {
      display: none;

      margin-top: 18px;

      padding: 15px;

      border-radius: 10px;

      text-align: center;

      font-size: 17px;

      font-weight: bold;
    }


    #message.success {
      display: block;

      background: #dcfce7;

      color: #166534;
    }


    #message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }


    /* ==========================
       ประวัติ
       ========================== */

    .history-title {
      margin-top: 30px;

      margin-bottom: 12px;

      font-size: 25px;
    }


    .history-item {
      padding: 14px;

      margin-top: 10px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      background: #fafafa;
    }


    .history-barcode {
      font-size: 18px;

      font-weight: bold;

      word-break: break-all;
    }


    .history-name {
      margin-top: 6px;

      font-size: 16px;
    }


    .history-time {
      margin-top: 5px;

      color: #666;

      font-size: 14px;
    }


    .empty {
      text-align: center;

      color: #777;

      padding: 20px;
    }


    @media (max-width: 600px) {

      body {
        padding: 8px;
      }


      .container {
        padding: 16px;

        border-radius: 12px;
      }


      h1 {
        font-size: 25px;
      }


      label {
        font-size: 18px;
      }


      select,
      input {
        font-size: 17px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📦 ระบบสแกน Barcode
  </h1>


  <!-- ======================================
       เลือกพนักงาน
       ====================================== -->

  <label for="employee">
    เลือกพนักงาน
  </label>


  <select id="employee">

    <option value="">
      -- เลือกพนักงาน --
    </option>

  </select>


  <!-- ======================================
       ชื่อจริง
       ====================================== -->

  <label for="fullName">
    ชื่อจริง
  </label>


  <input
    id="fullName"
    type="text"
    readonly
  >


  <!-- ======================================
       ชื่อเล่น
       ====================================== -->

  <label for="nickname">
    ชื่อเล่น
  </label>


  <input
    id="nickname"
    type="text"
    readonly
  >


  <!-- ======================================
       Barcode
       ====================================== -->

  <label for="barcode">
    เลขพัสดุ
  </label>


  <input
    id="barcode"
    type="text"
    placeholder="สแกนหรือกรอกเลขพัสดุ"
    autocomplete="off"
  >


  <!-- ======================================
       เปิดกล้อง
       ====================================== -->

  <button
    id="cameraButton"
    type="button"
  >
    📷 เปิดกล้องสแกน
  </button>


  <!-- ======================================
       กล้อง
       ====================================== -->

  <div id="cameraBox">

    <video
      id="video"
      playsinline
      muted
    ></video>

  </div>


  <!-- ======================================
       ปิดกล้อง
       ====================================== -->

  <button
    id="stopCamera"
    type="button"
  >
    ⛔ ปิดกล้อง
  </button>


  <!-- ======================================
       บันทึก
       ====================================== -->

  <button
    id="saveButton"
    type="button"
  >
    💾 บันทึกข้อมูล
  </button>


  <!-- ======================================
       แจ้งเตือน
       ====================================== -->

  <div id="message"></div>


  <!-- ======================================
       ประวัติ
       ====================================== -->

  <h2 class="history-title">
    ประวัติการสแกน
  </h2>


  <div id="historyList">

    <div class="empty">
      กำลังโหลดข้อมูล...
    </div>

  </div>


</div>



<script>


// =====================================================
// URL ของ Apps Script ตัวใหม่
// =====================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzKd3ePc5bylddKOU_3Fyp3kwNq6MpuvjB5StPJ_yoMdI7SuhnhZp5vh-GL2SDgvugt/exec";


// =====================================================
// รายชื่อพนักงาน 40 คน
// =====================================================

const employees = [

  ["จุรีพร สุขพิพัฒน์", "เฟิร์น"],

  ["วันวิสา เจริญโสภณ", "ปาร์ตี้"],

  ["ธัญวรัตน์ บุญวังทอง", "โม"],

  ["กัลย์สุดา บุญยืน", "แก้ว"],

  ["SAW MYINT HTUN", "ซอมี่"],

  ["ทิฆัมพร ละเอียด", "แนน"],

  ["เจต มานะพิมพ์", "เจต"],

  ["น้ำผึ้ง วรรณชิโนรส", "ผึ้ง"],

  ["HTOO", "ทู"],

  ["SAW DEN", "แดน"],

  ["น้ำฝน ยังเอี่ยม", "ฝน"],

  ["MIN CHIT SOE", "มิน ชิท ซู"],

  ["SAW MU (2)", "ซอมู"],

  ["ZAYAR MYLNT", "ซี ยา มิ"],

  ["EH POE SAI", "อิ โป ซาย"],

  ["SAW SHEE", "ซอชิ"],

  ["SOE WIN", "บ่าววี"],

  ["SAW TAR SI PAR", "วิททูล"],

  ["KYAW WIN NAING", "วินัย"],

  ["SAW MU (1)", "ซอมู"],

  ["ชลิตา จกัลยา", "ติ๊ก"],

  ["MYINT OO", "มิอู"],

  ["KAR KAR", "กา กา"],

  ["อมรรัตน์ เรืองลอยขำ", "อ้อย"],

  ["วิไลรัตน์ แก้วพิกุล", "จุ๊"],

  ["วันดี ยิ้มกัลป์", "ดาว"],

  ["LAY LAY", "เล"],

  ["THET HTAR AYE", "เอ"],

  ["SOE MIN OO", ""],

  ["จีราวัฒน์ อ้อนวอน", "บาส"],

  ["เอื้องแก้ว ธีรัชธรรมสรณ์", "เอ็ม"],

  ["HAN PHYO WAI", "เว"],

  ["อารี สูงขาว", "นุ้ย"],

  ["YIN MAR NWAI", "มาญ"],

  ["SAW SHWE OESI", "พี่แว่น"],

  ["หนูไกร อำภัยรัตน์", "ไกร"],

  ["ปวีณา หลอดทอง", "วี"],

  ["นันทญา แสงทอง", "นัน"],

  ["วันวิสา ลัภขุนทด", "กิ่ง"],

  ["SAW MOE LAY", "โม เล"]

];


// =====================================================
// ตัวแปรกล้อง
// =====================================================

let codeReader = null;

let cameraControls = null;


// =====================================================
// Element
// =====================================================

const employeeSelect =
  document.getElementById(
    "employee"
  );


const fullNameInput =
  document.getElementById(
    "fullName"
  );


const nicknameInput =
  document.getElementById(
    "nickname"
  );


const barcodeInput =
  document.getElementById(
    "barcode"
  );


const cameraButton =
  document.getElementById(
    "cameraButton"
  );


const stopCameraButton =
  document.getElementById(
    "stopCamera"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const cameraBox =
  document.getElementById(
    "cameraBox"
  );


const video =
  document.getElementById(
    "video"
  );


const messageBox =
  document.getElementById(
    "message"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


// =====================================================
// ใส่รายชื่อพนักงาน
// =====================================================

employees.forEach(
  function(person, index) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      index;


    option.textContent =
      person[0] +
      " (" +
      person[1] +
      ")";


    employeeSelect.appendChild(
      option
    );

  }
);


// =====================================================
// เลือกพนักงาน
// =====================================================

employeeSelect.addEventListener(
  "change",
  function() {

    const index =
      this.value;


    if (index === "") {

      fullNameInput.value =
        "";

      nicknameInput.value =
        "";

      return;

    }


    const person =
      employees[index];


    fullNameInput.value =
      person[0];


    nicknameInput.value =
      person[1];

  }
);


// =====================================================
// JSONP
// สำหรับเชื่อม GitHub → Apps Script
// =====================================================

function callAppsScript(
  params
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      function cleanup() {

        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;

          cleanup();

          resolve(data);

        };


      params.callback =
        callbackName;


      const query =
        new URLSearchParams();


      Object.keys(params).forEach(
        function(key) {

          query.append(
            key,
            params[key]
          );

        }
      );


      script.src =
        WEB_APP_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;

          cleanup();

          reject(
            new Error(
              "Load failed"
            )
          );

        };


      document.body.appendChild(
        script
      );


      // ป้องกันการรอนานเกินไป
      setTimeout(
        function() {

          if (finished) {
            return;
          }


          finished = true;

          cleanup();

          reject(
            new Error(
              "เชื่อมต่อ Apps Script ไม่สำเร็จ"
            )
          );

        },
        15000
      );

    }
  );

}


// =====================================================
// เปิดกล้อง
// =====================================================

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  // ปิดกล้องเดิมก่อน
  stopCamera();


  if (!window.ZXingBrowser) {

    showMessage(
      "โหลดระบบสแกน Barcode ไม่สำเร็จ",
      false
    );

    return;

  }


  try {

    cameraBox.style.display =
      "block";


    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้อง"
      );

    }


    // ใช้กล้องตัวสุดท้าย
    const deviceId =
      devices[
        devices.length - 1
      ].deviceId;


    cameraControls =
      await codeReader
        .decodeFromVideoDevice(

          deviceId,

          video,

          function(result) {

            if (!result) {
              return;
            }


            const code =
              result.getText();


            // ใส่ Barcode ลงช่อง
            barcodeInput.value =
              code;


            // หยุดกล้องทันที
            stopCamera();


            showMessage(
              "สแกนสำเร็จ: " + code,
              true
            );

          }

        );


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    stopCamera();


    showMessage(
      "เปิดกล้องไม่ได้: " +
      (
        error.message ||
        error
      ),
      false
    );

  }

}


// =====================================================
// ปิดกล้อง
// =====================================================

stopCameraButton.addEventListener(
  "click",
  stopCamera
);


function stopCamera() {

  try {

    if (cameraControls) {

      cameraControls.stop();

      cameraControls =
        null;

    }

  } catch (error) {

    console.error(error);

  }


  try {

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      video.srcObject =
        null;

    }

  } catch (error) {

    console.error(error);

  }


  cameraBox.style.display =
    "none";

}


// =====================================================
// บันทึกข้อมูล
// =====================================================

saveButton.addEventListener(
  "click",
  saveData
);


async function saveData() {

  const fullName =
    fullNameInput.value.trim();


  const nickname =
    nicknameInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  // ตรวจพนักงาน
  if (!fullName) {

    showMessage(
      "กรุณาเลือกพนักงานก่อน",
      false
    );

    return;

  }


  // ตรวจ Barcode
  if (!barcode) {

    showMessage(
      "กรุณาสแกนหรือกรอกเลขพัสดุ",
      false
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  try {

    const result =
      await callAppsScript({

        action:
          "save",

        fullName:
          fullName,

        nickname:
          nickname,

        barcode:
          barcode

      });


    // ==============================
    // Barcode ซ้ำ
    // ==============================

    if (
      result &&
      result.duplicate
    ) {

      showMessage(
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว: " +
        barcode,
        false
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 บันทึกข้อมูล";


      return;

    }


    // ==============================
    // สำเร็จ
    // ==============================

    if (
      result &&
      result.success
    ) {

      showMessage(
        "✅ บันทึกสำเร็จ: " +
        barcode,
        true
      );


      // ล้าง Barcode
      barcodeInput.value =
        "";


      // โหลดประวัติ
      loadHistory();


    } else {

      showMessage(
        result &&
        result.message
          ? result.message
          : "บันทึกข้อมูลไม่สำเร็จ",
        false
      );

    }


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    showMessage(
      "เชื่อมต่อระบบไม่ได้: " +
      error.message,
      false
    );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "💾 บันทึกข้อมูล";

}


// =====================================================
// โหลดประวัติ
// =====================================================

async function loadHistory() {

  historyList.innerHTML =
    '<div class="empty">' +
    'กำลังโหลดข้อมูล...' +
    '</div>';


  try {

    const result =
      await callAppsScript({

        action:
          "history",

        limit:
          "20"

      });


    // ==============================
    // ไม่มีข้อมูล
    // ==============================

    if (
      !result ||
      !result.success ||
      !result.items ||
      result.items.length === 0
    ) {

      historyList.innerHTML =
        '<div class="empty">' +
        'ยังไม่มีข้อมูลการสแกน' +
        '</div>';

      return;

    }


    historyList.innerHTML =
      "";


    // ==============================
    // แสดงประวัติ
    // ==============================

    result.items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        const barcode =
          document.createElement(
            "div"
          );


        barcode.className =
          "history-barcode";


        barcode.textContent =
          item.barcode ||
          "";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "history-name";


        name.textContent =
          item.fullName +
          (
            item.nickname
              ? " (" +
                item.nickname +
                ")"
              : ""
          );


        const time =
          document.createElement(
            "div"
          );


        time.className =
          "history-time";


        time.textContent =
          (
            item.date || ""
          ) +
          " " +
          (
            item.time || ""
          );


        div.appendChild(
          barcode
        );


        div.appendChild(
          name
        );


        div.appendChild(
          time
        );


        historyList.appendChild(
          div
        );

      }
    );


  } catch (error) {

    console.error(
      "History error:",
      error
    );


    historyList.innerHTML =
      '<div class="empty">' +
      'โหลดประวัติไม่สำเร็จ: ' +
      error.message +
      '</div>';

  }

}


// =====================================================
// แสดงข้อความ
// =====================================================

function showMessage(
  text,
  success
) {

  messageBox.textContent =
    text;


  messageBox.className =
    success
      ? "success"
      : "error";


  messageBox.style.display =
    "block";


  setTimeout(
    function() {

      messageBox.style.display =
        "none";

    },
    4000
  );

}


// =====================================================
// เริ่มระบบ
// =====================================================

loadHistory();


</script>


</body>

</html>
